            { key: 'currentPct', label: 'Current %', align: 'right', render: (r) => `${r.currentPct}%` },
            { key: 'availableFrom', label: 'Available from', render: (r) => fmtDate(r.availableFrom, true) },
            { key: 'onBenchDays', label: `At ≤ ${threshold}% for`, align: 'right', render: (r) => <span title={r.since ? `Since ${fmtDate(r.since, true)}` : 'Since before the data starts'}>{r.since ? `${r.onBenchDays} d` : `${r.onBenchDays}+ d`}</span> },
            { key: 'skills', label: 'Skills', sortable: false, csv: (r) => r.skills.map((s) => `${s.skill} ${s.level}`).join('; '), render: (r) => <Skills list={r.skills} active={f.skill} /> },
            { key: 'matches', label: 'Matching positions', align: 'right', value: (r) => r.matches.length, csv: (r) => r.matches.map((m) => m.code).join('; '), render: (r) => r.matches.length || '–' },
          ]} />
      </Panel>
    </>
  );
}

/* ----------------------------- Project Headcount ----------------------------- */
function HeadcountView({ idx, f, people, groupBy }) {
  const [status, setStatus] = useState('active');   // app default: active projects only
  const [focus, setFocus] = useState(null);
  useEffect(() => setFocus(null), [resetOn(f), status]);

  const all = useMemo(() => projectHeadcount(idx, f, people), [idx, f, people]);
  const fyFrom = fyOf(f.from).start, fyTo = fyOf(minS(f.to, AS_OF)).end;
  // Without people booked, a project shows only when it ran in the selected financial year(s).
  const list = all.filter((p) => (status === ALL || p.status === status) && (p.headcount > 0 || (status !== 'active' && overlaps(p.project.start, p.project.end || '9999-12-31', fyFrom, fyTo))));
  const trend = useMemo(() => headcountTrend(idx, f, people), [idx, f, people]);
  const totalHead = list.reduce((s, p) => s + p.headcount, 0);
  const unique = new Set(list.flatMap((p) => p.members.map((m) => m.employee.id))).size;
  const onBillable = new Set(list.filter((p) => p.project.billable).flatMap((p) => p.members.map((m) => m.employee.id))).size;
  const ending = list.filter((p) => p.status === 'active' && p.daysLeft != null && p.daysLeft >= 0 && p.daysLeft <= 60).sort((a, b) => a.daysLeft - b.daysLeft);
  const small = list.filter((p) => p.status === 'active' && p.project.billable && p.headcount > 0 && p.headcount <= 2);
  const tableRows = list.filter((p) => !focus || p.id === focus);
  const personRows = (() => {
    const m = new Map();
    for (const p of tableRows) for (const mm of p.members) {
      const x = m.get(mm.employee.id) || { id: mm.employee.id, employee: mm.employee, team: mm.team, projects: [] };
      x.projects.push({ project: p.project, percent: mm.percent, end: mm.end }); m.set(x.id, x);
    }
    return [...m.values()].map((x) => ({ ...x, count: x.projects.length, total: x.projects.reduce((t, q) => t + q.percent, 0), billable: x.projects.some((q) => q.project.billable) }));
  })();
  const STAT = { active: ['Active', 'b-healthy'], on_hold: ['On hold', 'b-neutral'], completed: ['Completed', 'b-neutral'] };

  return (
    <>
      <Kpis scope="headcount" items={[
        { label: 'Total projects', value: list.length, sub: <span className="dim">{list.filter((p) => p.project.billable).length} billable, {list.filter((p) => !p.project.billable).length} internal</span> },
        { label: 'Total headcount', value: totalHead, sub: <span className="dim">{unique} unique people; some work on more than one project</span>, spark: { data: trend.map((t) => ({ ...t, all: t.billable + t.internal })), k: 'all', color: '#9C4BE6' } },
        { label: 'On billable work', value: onBillable, unit: 'people', sub: <><b className="num">{fmtPct(unique ? (onBillable / unique) * 100 : null)}</b><span className="dim">of people on projects; {unique - onBillable} on internal work only</span></> },
        { label: 'Ending in 60 days', value: ending.length, unit: 'projects', sub: ending.length ? <><b className="num">{ending.reduce((s, p) => s + p.headcount, 0)}</b><span className="dim">people to place</span></> : <span className="dim">None ending soon</span> },
      ]} />

      <div className="row main">
        <Panel title="Project runway" note="Each bar runs from a project's start to its planned end within the financial year, with the people booked on it. Bars marked 'since' began in an earlier year. Amber bars end within 60 days. Click a bar to open the project in the table."
          tools={<Seg small label="Project status" options={[['active', 'Active'], ['completed', 'Completed'], ['on_hold', 'On hold'], [ALL, 'All']]} value={status} onChange={setStatus} />}>
          {(() => {
            const t0 = fyFrom;
            const t1 = addDays(fyTo, 1);
            const last = addDays(t1, -1);
            const dx = (d) => diffDays(t0, d);
            const RUN = { billable: '#9C4BE6', ending: '#C47E00', internal: '#C3C6D9', done: '#E3E4EF' };
            const runway = list.filter((p) => p.project.start <= last && (!p.project.end || p.project.end >= t0)).map((p) => {
              const st = maxS(p.project.start, t0), en = minS(p.project.end || last, last);
              const kind = p.status !== 'active' ? 'done' : !p.project.billable ? 'internal' : p.daysLeft != null && p.daysLeft <= 60 ? 'ending' : 'billable';
              return { id: p.id, name: p.project.name, offset: dx(st), span: Math.max(4, dx(en) - dx(st)), kind, headcount: p.headcount, onBillable: p.onBillable, start: p.project.start, end: p.project.end, client: p.project.client, clipped: p.project.start < t0 };
            }).sort((a, b) => (a.end || '9999').localeCompare(b.end || '9999'));
            const yearly = diffDays(t0, t1) > 900;   // over about two and a half years, tick each financial year
            const ticks = []; for (let m = t0; m < t1; m = addDays(endOfMonth(m), 1)) if (yearly ? m.slice(5, 7) === '04' : ['01', '04', '07', '10'].includes(m.slice(5, 7))) ticks.push(dx(m));
            if (!runway.length) return <div className="state"><h3>No projects with this status</h3><p>Pick another status.</p></div>;
            return (<>
              <Legend items={[{ label: 'Billable', color: RUN.billable }, { label: 'Ends within 60 days', color: RUN.ending }, { label: 'Internal', color: RUN.internal }, { label: 'Completed or on hold', color: RUN.done }]} />
              <div className="clickable" style={{ height: runway.length * 34 + 44 }}><ResponsiveContainer>
                <BarChart data={runway} layout="vertical" margin={{ top: 16, right: 76, bottom: 0, left: 0 }} barCategoryGap={7}>
                  <CartesianGrid stroke="#EEEEF8" horizontal={false} />
                  <XAxis type="number" domain={[0, dx(t1)]} ticks={ticks} tickFormatter={(v) => fmtMonth(addDays(t0, v))} {...axis} />
                  <YAxis type="category" dataKey="name" {...axis} width={180} />
                  {AS_OF >= t0 && AS_OF <= last && <ReferenceLine x={dx(AS_OF)} stroke="#0F1333" strokeWidth={1.5} label={{ value: 'Today', position: 'top', fill: '#0F1333', fontSize: 11 }} />}
                  <Tooltip cursor={barCursor} content={<Tip title={(d) => d.name} rows={(d) => [['Runs', fmtDate(d.start, true) + ' – ' + (d.end ? fmtDate(d.end, true) : 'open-ended')], ['Running for', fmtSpan(d.start, minS(d.end || AS_OF, AS_OF))], ['People', d.headcount], ['On billable work', d.onBillable], ['Client', d.client]]} />} />
                  <Bar dataKey="offset" stackId="r" fill="transparent" isAnimationActive={false} />
                  <Bar dataKey="span" stackId="r" radius={4} maxBarSize={16} isAnimationActive={false} onClick={(d) => setFocus(focus === d.payload.id ? null : d.payload.id)}>
                    {runway.map((r) => <Cell key={r.id} fill={RUN[r.kind]} fillOpacity={focus && focus !== r.id ? 0.35 : 1} />)}
                    <LabelList dataKey="headcount" content={({ x, y, width, height, index }) => { const r = runway[index]; if (!r) return null; return <g>
                      {r.clipped && width > 96 && <text x={x + 7} y={y + height / 2 + 4} fontSize={10.5} fontWeight={600} fill={r.kind === 'billable' || r.kind === 'ending' ? '#fff' : '#3D4466'}>{'◂ since ' + fmtMonth(r.start)}</text>}
                      {r.headcount > 0 && <text x={x + width + 6} y={y + height / 2 + 4} fontSize={11.5} fill="#3D4466">{r.headcount + (r.headcount === 1 ? ' person' : ' people')}</text>}</g>; }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer></div>
            </>);
          })()}
        </Panel>
        <Panel title="Needs attention">
          <Attention groups={[
            { title: 'Ending in the next 60 days', items: ending.map((p) => ({ key: p.id, who: p.project.name, why: `${p.project.client}, ends ${fmtDate(p.project.end, true)}, ${p.headcount} people to place`, fig: `${p.daysLeft} d`, icon: 'calendar', color: 'var(--amber)', active: focus === p.id, onClick: () => setFocus(focus === p.id ? null : p.id) })) },
            { title: 'Billable projects with 1–2 people', items: small.map((p) => ({ key: p.id, who: p.project.name, why: `Depends on ${p.members.map((m) => m.employee.name).join(' and ')}`, fig: `${p.headcount}`, icon: 'users', color: 'var(--ink-2)', active: focus === p.id, onClick: () => setFocus(focus === p.id ? null : p.id) })) },
          ]} />
        </Panel>
      </div>

      <Panel title={groupBy === 'Project' ? 'Project-wise headcount' : groupBy === 'Skill' ? 'Headcount by skill' : 'Headcount by employee'} note={groupBy === 'Project' ? 'Click a row to see who is on the project.' : 'Everyone booked on the projects above, with what they are booked on.'} tools={focus && <Chip onClear={() => setFocus(null)}>{idx.projectById.get(focus).name}</Chip>}>
{groupBy === 'Project' ? <>
        <DataTable csvName="project-headcount" rows={tableRows} initialSort={{ key: 'headcount', dir: 'desc' }} empty="No projects in this selection"
          expand={(p) => p.members.length ? <div className="slots">{p.members.map((m) => <div className="slot" key={m.employee.id}><span className="n num">{m.percent}%</span><span>{m.employee.name} <span className="sub2">{m.employee.role}, {m.team}</span></span><span className="sub2">until {fmtDate(m.end, true)}</span></div>)}</div> : <span className="sub2">No one booked in this range.</span>}
          columns={[
            { key: 'name', label: 'Project', value: (p) => p.project.name, render: (p) => <div><div>{p.project.name}</div><div className="sub2">{p.project.client}</div></div> },
            { key: 'pm', label: 'PM', value: (p) => p.project.pm, render: (p) => p.project.pm },
            { key: 'headcount', label: 'Headcount', align: 'right', render: (p) => <b>{p.headcount}</b> },
            { key: 'onBillable', label: 'On billable work', align: 'right', render: (p) => p.project.billable ? p.onBillable : <span className="sub2">Internal</span> },
            { key: 'type', label: 'Type', value: (p) => p.project.billable ? 'Billable' : 'Internal', render: (p) => p.project.billable ? 'Billable' : 'Internal' },
            { key: 'start', label: 'Started', value: (p) => p.project.start, render: (p) => <div><div>{fmtDate(p.project.start, true)}</div><div className="sub2">{fmtSpan(p.project.start, minS(p.project.end || AS_OF, AS_OF))}{!p.project.end || p.project.end > AS_OF ? ' so far' : ''}</div></div> },
            { key: 'end', label: 'Ends', value: (p) => p.project.end || '9999', csv: (p) => p.project.end || '', render: (p) => p.project.end ? fmtDate(p.project.end, true) : 'Open-ended' },
            { key: 'status', label: 'Status', csv: (p) => STAT[p.status][0], render: (p) => <Badge cls={STAT[p.status][1]}>{STAT[p.status][0]}</Badge> },
          ]} /></> : <>
        <DataTable csvName="headcount-by-employee" rows={personRows} group={groupBy === 'Skill' ? (r) => r.employee.skills[0].skill : undefined} initialSort={{ key: 'total', dir: 'desc' }} empty="No one booked on these projects"
          columns={[
            { key: 'name', label: 'Employee', value: (r) => r.employee.name, render: (r) => <Person e={r.employee} sub={r.employee.role} /> },
            { key: 'team', label: 'Team' },
            { key: 'projects', label: 'Projects', sortable: false, csv: (r) => r.projects.map((q) => q.project.name + ' ' + q.percent + '%').join('; '), render: (r) => <span className="sub2" style={{ color: 'var(--ink-2)' }}>{r.projects.map((q) => q.project.name + ' ' + q.percent + '%').join(', ')}</span> },
            { key: 'count', label: 'No. of projects', align: 'right' },
            { key: 'total', label: 'Booked', align: 'right', render: (r) => <Pct v={r.total} tone={toneLoad(r.total)} /> },
            { key: 'billable', label: 'On billable work', value: (r) => (r.billable ? 1 : 0), csv: (r) => (r.billable ? 'Yes' : 'No'), render: (r) => (r.billable ? 'Yes' : <span className="sub2">Internal only</span>) },
          ]} /></>}
      </Panel>
    </>
  );
}

/* ----------------------------- Skill Gap ----------------------------- */
function SkillGapView({ idx, f, people, groupBy }) {
  const [mode, setMode] = useState('chart');
  const [statusDrill, setStatusDrill] = useState('');
  const [focus, setFocus] = useState(null);
  useEffect(() => { setStatusDrill(''); setFocus(null); }, [resetOn(f)]);

  const rows = useMemo(() => skillGap(idx, f), [idx, f]);
  const demand = rows.reduce((s, r) => s + r.demand, 0);
  const supply = rows.reduce((s, r) => s + Math.min(r.supply, r.demand), 0);
  const totalSupply = rows.reduce((s, r) => s + r.supply, 0);
  const gap = rows.reduce((s, r) => s + r.gap, 0);
  const counts = ['covered', 'partial', 'gap'].map((s) => ({ status: s, n: rows.filter((r) => r.status === s).length }));
  const tableRows = rows.filter((r) => (!statusDrill || r.status === statusDrill) && (!focus || r.skill === focus));
  const GAPC = { covered: '#0D9458', partial: '#C47E00', gap: '#D13C2C' };
  const axisMax = Math.max(3, Math.ceil((Math.max(0, ...rows.map((r) => Math.max(r.demand, r.supply))) + 1) / 3) * 3);
  const axisTicks = Array.from({ length: axisMax / 3 + 1 }, (_, i) => i * 3);
  // Scatter labels for short skills only. Skills at the same point share one label; when two labels sit on the
  // same row, the rightmost stays beside its dot and the others lift above theirs so they don't collide.
  const scatterLabels = (() => {
    const groups = new Map();
    rows.forEach((r, i) => {
      if (r.status === 'covered') return;
      const k = r.demand + ':' + r.supply;
      const g = groups.get(k) || { i, demand: r.demand, supply: r.supply, names: [] };
      g.names.push(r.skill); groups.set(k, g);
    });
    const out = new Map(); const perRow = new Map();
    [...groups.values()].sort((a, b) => b.demand - a.demand).forEach((g) => {
      const rank = perRow.get(g.supply) || 0; perRow.set(g.supply, rank + 1);
      out.set(g.i, { text: g.names.join(', '), above: rank > 0, lift: 12 + (rank - 1) * 14 });
    });
    return out;
  })();

  return (
    <>
      <Kpis scope="skill_gap" items={[
        { label: 'Total demand', value: demand, unit: 'positions', sub: <span className="dim">{rows.length} skills required by active projects</span> },
        { label: 'Total supply', value: Math.min(totalSupply, demand), unit: 'people', sub: <span className="dim">Qualified people, capped at demand</span> },
        { label: 'Total gap', value: gap, unit: 'positions', sub: gap ? <><Icon name="alert" size={12} /><b className="num">{counts[2].n}</b><span className="dim">skills with nobody qualified</span></> : <span className="dim">Every requirement can be met</span> },
        { label: 'Demand covered', value: fmtPct(demand ? (supply / demand) * 100 : null), tone: demand ? toneHigh((supply / demand) * 100) : null, sub: <span className="dim">{counts[0].n} covered, {counts[1].n} partial, {counts[2].n} gap</span> },
      ]} />

      <div className="row main">
        <Panel title="Which skills we cannot staff" note="Each dot is a skill: positions needed on active projects against employees at the minimum level. Dots under the dashed line are short of people. Click a dot to open it in the table.">
          {rows.length ? (<>
            <Legend items={[{ label: 'Gap, nobody qualified', color: GAPC.gap }, { label: 'Partial', color: GAPC.partial }, { label: 'Covered', color: GAPC.covered }]} />
            <div className="chart clickable"><ResponsiveContainer>
              <ScatterChart margin={{ top: 8, right: 24, bottom: 18, left: -8 }}>
                <ReferenceArea x1={0} x2={axisMax} y1={0} y2={0.5} fill="#D13C2C" fillOpacity={0.05} ifOverflow="hidden" />
                <CartesianGrid stroke="#EEEEF8" />
                <XAxis type="number" dataKey="demand" name="Positions needed" {...axis} allowDecimals={false} domain={[0, axisMax]} ticks={axisTicks}
                  label={{ value: 'Positions needed', position: 'insideBottom', offset: -10, fill: '#6B7399', fontSize: 11.5 }} />
                <YAxis type="number" dataKey="supply" name="Qualified people" {...axis} allowDecimals={false} domain={[0, axisMax]} ticks={axisTicks}
                  label={{ value: 'Qualified people', angle: -90, position: 'insideLeft', offset: 18, fill: '#6B7399', fontSize: 11.5 }} />
                <ZAxis range={[100, 100]} />
                <ReferenceLine segment={[{ x: 0, y: 0 }, { x: axisMax, y: axisMax }]} stroke="#6B7399" strokeDasharray="4 4" ifOverflow="hidden" />
                <Tooltip cursor={{ strokeDasharray: '3 3' }} content={<Tip title={(d) => d.skill + ', level ' + d.minLevel + '+'} rows={(d) => [['Positions needed', d.demand], ['Qualified', d.supply], ['Status', GAP[d.status].label]]} note={(d) => d.projects.map((x) => x.name).join(', ')} />} />
                <Scatter data={rows} isAnimationActive={false} onClick={(d) => { const k = (d.payload || d).skill; setFocus(focus === k ? null : k); }}>
                  {rows.map((r) => <Cell key={r.skill} fill={GAPC[r.status]} stroke="#fff" strokeWidth={2} fillOpacity={focus && focus !== r.skill ? 0.3 : 0.9} />)}
                  <LabelList dataKey="skill" content={({ x, y, width = 0, height = 0, index }) => { const l = scatterLabels.get(index); if (!l) return null;
                    return l.above ? <text x={x + width / 2} y={y - l.lift + 6} fontSize={11} fill="#3D4466" textAnchor="middle" stroke="#fff" strokeWidth={3} paintOrder="stroke">{l.text}</text>
                      : <text x={x + width + 4} y={y + height / 2 + 4} fontSize={11} fill="#3D4466" stroke="#fff" strokeWidth={3} paintOrder="stroke">{l.text}</text>; }} />
                </Scatter>
              </ScatterChart>
            </ResponsiveContainer></div>
          </>) : <div className="state"><h3>No skill requirements for these filters</h3><p>Clear the project or skill filter to see all active-project demand.</p></div>}
        </Panel>
        <Panel title="Needs attention" note="Click a skill to open it in the table.">
          <Attention groups={[
            { title: 'Nobody qualified', items: rows.filter((r) => r.status === 'gap').map((r) => ({ key: r.skill, who: r.skill, why: `${r.projects.map((x) => x.name).join(', ')}${r.nearMiss.length ? `. ${r.nearMiss.length} one level below` : ''}`, fig: `${r.demand} needed`, icon: 'alert', color: 'var(--red)', active: focus === r.skill, onClick: () => setFocus(focus === r.skill ? null : r.skill) })) },
            { title: 'Partly covered', items: rows.filter((r) => r.status === 'partial').map((r) => ({ key: r.skill, who: r.skill, why: `${r.supply} of ${r.demand} at level ${r.minLevel}+`, fig: `${r.gap} short`, icon: 'dash', color: 'var(--amber)', active: focus === r.skill, onClick: () => setFocus(focus === r.skill ? null : r.skill) })) },
          ]} />
        </Panel>
      </div>

      <Panel title="Skill gap analysis" note="Active project requirements against employee skills across the whole organisation, so the team filter does not narrow supply. Coverage is supply over demand, capped at 100%. Click a row for qualified people and the projects asking."
        tools={<>
          <Seg small label="Status" options={[['', 'All'], ['gap', `Gap ${counts[2].n}`], ['partial', `Partial ${counts[1].n}`], ['covered', `Covered ${counts[0].n}`]]} value={statusDrill} onChange={setStatusDrill} />
          {focus && <Chip onClear={() => setFocus(null)}>{focus}</Chip>}</>}>
        <DataTable csvName="skill-gap" rows={tableRows} group={groupBy === 'Project' ? (r) => r.projects.map((x) => x.name) : groupBy === 'Employee' ? (r) => (r.qualified.length ? r.qualified.map((e) => e.name) : 'Nobody qualified') : undefined} initialSort={{ key: 'gap', dir: 'desc' }} empty="No skills in this selection"
          expand={(r) => (
            <div className="slots">
              <div><span className="sub2">Needed by </span>{r.projects.map((x) => `${x.name} (${x.positions} at level ${x.minLevel}+)`).join(', ')}</div>
              <div><span className="sub2">Qualified </span>{r.qualified.length ? r.qualified.map((e) => <span key={e.id} className="skill">{e.name}</span>) : 'Nobody'}</div>
              {r.nearMiss.length > 0 && <div><span className="sub2">One level below </span>{r.nearMiss.map((e) => e.name).join(', ')}</div>}
            </div>)}
          columns={[
            { key: 'skill', label: 'Skill', render: (r) => <b style={{ fontWeight: 600 }}>{r.skill}</b> },
            { key: 'minLevel', label: 'Min prof.', render: (r) => <Dots n={r.minLevel} /> },
            { key: 'demand', label: 'Demand', align: 'right' },
            { key: 'supply', label: 'Supply', align: 'right' },
            { key: 'gap', label: 'Gap', align: 'right', render: (r) => r.gap ? <b style={{ color: 'var(--red)' }}>-{r.gap}</b> : '0' },
            { key: 'coverage', label: 'Coverage', render: (r) => <Meter pct={r.coverage} color={toneColor(toneHigh(r.coverage))} /> },
            { key: 'status', label: 'Status', value: (r) => ({ gap: 0, partial: 1, covered: 2 })[r.status], csv: (r) => GAP[r.status].label, render: (r) => <Badge cls={GAP[r.status].cls} icon={GAP[r.status].icon}>{GAP[r.status].label}</Badge> },
          ]} />
      </Panel>
    </>
  );
}

/* ----------------------------- Open Positions ----------------------------- */
function PositionsView({ idx, f }) {
  const [st, setSt] = useState('');
  const [pri, setPri] = useState('');
  const [src, setSrc] = useState('');
  const [projDrill, setProjDrill] = useState(null);
  const [slotDrill, setSlotDrill] = useState(null);
  const [posFocus, setPosFocus] = useState(null);
  useEffect(() => { setProjDrill(null); setSlotDrill(null); setPosFocus(null); }, [resetOn(f)]);

  const base = useMemo(() => scopedPositions(idx, f), [idx, f]);
  // App default: open statuses only, unless a status is picked.
  const list = base.filter((p) => (st ? p.status === st : ['submitted', 'in_review', 'approved', 'on_hold'].includes(p.status)) && (!pri || p.priority === pri) && (!src || p.source === src));
  const slotsOf = (ps) => ps.flatMap((p) => p.slots.map(slotKind));
  const allSlots = slotsOf(list);
  const filledInternal = list.reduce((a, p) => a + p.slots.filter((s) => s && s.state === 'confirmed').length, 0);   // app: any confirmed mapping that is not an open hire slot
  const toHire = allSlots.filter((k) => k === 'hire').length;
  const overdue = list.filter((p) => overdueOf(p, AS_OF) === 'red');
  const dueSoon = list.filter((p) => overdueOf(p, AS_OF) === 'amber');
  const byStatus = POS_STATUS_ORDER.map((s) => ({ status: s, label: POS_STATUS[s].label, count: base.filter((p) => p.status === s && (!pri || p.priority === pri) && (!src || p.source === src)).length }));
  const byProject = [...new Set(list.filter((p) => !['fulfilled', 'closed'].includes(p.status)).map((p) => p.projectId))].map((pid) => {
    const ks = slotsOf(list.filter((p) => p.projectId === pid && !['fulfilled', 'closed'].includes(p.status)));
    const r = { projectId: pid, name: idx.projectById.get(pid).name };
    for (const k of Object.keys(SLOT)) r[k] = ks.filter((x) => x === k).length;
    r.total = ks.length;
    return r;
  }).sort((a, b) => b.total - a.total);
  const rows = list.filter((p) => (!projDrill || p.projectId === projDrill) && (!posFocus || p.id === posFocus) && (!slotDrill || p.slots.some((s) => slotKind(s) === slotDrill))).map((p) => ({ ...p, project: idx.projectById.get(p.projectId), od: overdueOf(p, AS_OF) }));
  const unassignedCritical = list.filter((p) => ['critical', 'high'].includes(p.priority) && !['fulfilled', 'closed', 'on_hold'].includes(p.status) && p.slots.some((s) => !s));

  return (
    <>
      <div className="filters" style={{ marginTop: -4 }}>
        <span className="field"><label htmlFor="pst">Status</label><select id="pst" value={st} onChange={(e) => setSt(e.target.value)}><option value="">All statuses</option>{POS_STATUS_ORDER.map((s) => <option key={s} value={s}>{POS_STATUS[s].label}</option>)}</select></span>
        <span className="field"><label htmlFor="ppr">Priority</label><select id="ppr" value={pri} onChange={(e) => setPri(e.target.value)}><option value="">All priorities</option>{PRIORITY_ORDER.map((s) => <option key={s} value={s}>{PRIORITY[s]}</option>)}</select></span>
        <span className="field"><label htmlFor="psrc">Source</label><select id="psrc" value={src} onChange={(e) => setSrc(e.target.value)}><option value="">All sources</option><option value="manual">Manual</option><option value="forecast">Forecast</option></select></span>
        <span className="sub2">Open positions are a current snapshot, so the date range does not apply.</span>
      </div>

      <Kpis scope="open_positions" items={[
        { label: 'Total positions', value: list.length, sub: <span className="dim">{allSlots.length} slots across them</span> },
        { label: 'Filled (internal)', value: filledInternal, unit: 'slots', sub: <span className="dim">{allSlots.filter((k) => k === 'proposed').length} more proposed internally</span> },
        { label: 'To hire (market)', value: toHire, unit: 'slots', sub: <span className="dim">{allSlots.filter((k) => k === 'unassigned').length} slots still unassigned</span> },
        { label: 'Overdue', value: overdue.length, sub: dueSoon.length ? <><Icon name="clock" size={12} /><b className="num">{dueSoon.length}</b><span className="dim">due within 3 days</span></> : <span className="dim">Needed-by date has passed</span> },
      ]} />

      <div className="row main">
        <Panel title="How late each open position is" note="Days past the needed-by date (left, red) or still to go (right). Positions due within two weeks are amber. Click a bar to open the position in the table.">
          {(() => {
            const open = list.filter((p) => !['fulfilled', 'closed'].includes(p.status)).map((p) => {
              const d = diffDays(AS_OF, p.neededBy);
              return { id: p.id, label: p.code.slice(-4) + '  ' + p.role, days: d, code: p.code, role: p.role, project: idx.projectById.get(p.projectId).name, priority: p.priority, unfilled: p.slots.filter((x) => slotKind(x) !== 'filled').length, headcount: p.headcount };
            }).sort((a, b) => a.days - b.days);
            if (!open.length) return <div className="state"><h3>No positions in progress</h3><p>Change the status filter to see more.</p></div>;
            const step = Math.max(...open.map((o) => Math.abs(o.days))) > 45 ? 30 : 15;
            const span = Math.ceil((Math.max(30, ...open.map((o) => Math.abs(o.days))) + 4) / step) * step;
            const ticks = Array.from({ length: (2 * span) / step + 1 }, (_, i) => -span + i * step);
            const tone = (d) => (d < 0 ? '#D13C2C' : d <= 14 ? '#C47E00' : '#9C4BE6');
            return (
              <div className="clickable" style={{ height: open.length * 30 + 40 }}><ResponsiveContainer>
                <BarChart data={open} layout="vertical" margin={{ top: 14, right: 20, bottom: 0, left: 0 }} barCategoryGap={6}>
                  <CartesianGrid stroke="#EEEEF8" horizontal={false} />
                  <XAxis type="number" domain={[-span, span]} ticks={ticks} tickFormatter={(v) => (v === 0 ? 'Today' : v < 0 ? -v + ' d late' : v + ' d to go')} {...axis} />
                  <YAxis type="category" dataKey="label" {...axis} width={190} />
                  <ReferenceLine x={0} stroke="#0F1333" strokeWidth={1.5} />
                  <Tooltip cursor={barCursor} content={<Tip title={(d) => d.code + ' ' + d.role} rows={(d) => [[d.days < 0 ? 'Days late' : 'Days to go', Math.abs(d.days), tone(d.days)], ['Project', d.project], ['Priority', PRIORITY[d.priority]], ['Slots not filled', d.unfilled + ' of ' + d.headcount]]} />} />
                  <Bar dataKey="days" maxBarSize={14} isAnimationActive={false} onClick={(d) => setPosFocus(posFocus === d.payload.id ? null : d.payload.id)}>
                    {open.map((o) => <Cell key={o.id} fill={tone(o.days)} radius={o.days < 0 ? [4, 0, 0, 4] : [0, 4, 4, 0]} fillOpacity={posFocus && posFocus !== o.id ? 0.3 : 1} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer></div>
            );
          })()}
        </Panel>
        <Panel title="Needs attention">
          <Attention groups={[
            { title: 'Past needed-by date', items: [...overdue].sort((a, b) => a.neededBy.localeCompare(b.neededBy)).map((p) => ({ key: p.id, who: `${p.code} ${p.role}`, why: `${idx.projectById.get(p.projectId).name}, ${PRIORITY[p.priority].toLowerCase()}, ${POS_STATUS[p.status].label.toLowerCase()}`, fig: `${diffDays(p.neededBy, AS_OF)} d late`, icon: 'alert', color: 'var(--red)', active: projDrill === p.projectId, onClick: () => setProjDrill(projDrill === p.projectId ? null : p.projectId) })) },
            { title: 'Critical or high with unassigned slots', items: unassignedCritical.map((p) => ({ key: p.id, who: `${p.code} ${p.role}`, why: `${p.slots.filter((s) => !s).length} of ${p.headcount} unassigned, needed ${fmtDate(p.neededBy)}`, fig: PRIORITY[p.priority], icon: 'users', color: 'var(--ink-2)', active: projDrill === p.projectId, onClick: () => setProjDrill(projDrill === p.projectId ? null : p.projectId) })) },
          ]} />
        </Panel>
      </div>

      <Panel title="Positions" note="Click a row to see each slot: who is proposed or confirmed, or the job code being hired against."
        tools={<>{posFocus && <Chip onClear={() => setPosFocus(null)}>{idx.data.positions.find((x) => x.id === posFocus).code}</Chip>}{slotDrill && <Chip onClear={() => setSlotDrill(null)}>Has {SLOT[slotDrill].label.toLowerCase()} slots</Chip>}{projDrill && <Chip onClear={() => setProjDrill(null)}>{idx.projectById.get(projDrill).name}</Chip>}</>}>
        <DataTable csvName="open-positions" rows={rows} initialSort={{ key: 'neededBy', dir: 'asc' }} empty="No positions match these filters"
          expand={(p) => (
            <div className="slots">{p.slots.map((s, i) => {
              const k = slotKind(s);
              return (
                <div className="slot" key={i}>
                  <span className="n num">{i + 1} / {p.headcount}</span>
                  <span>{!s ? <i className="sub2">Unassigned</i> : s.type === 'hire' ? <>Market hire against <span className="code">{s.jobCode}</span></> : s.name}</span>
                  <span><i className="sw" style={{ background: SLOT[k].color, marginRight: 6 }} />{SLOT[k].label}</span>
                </div>);
            })}</div>)}
          columns={[
            { key: 'code', label: 'Code', render: (p) => <span className="code">{p.code}</span> },
            { key: 'project', label: 'Project', value: (p) => p.project.name, render: (p) => p.project.name },
            { key: 'role', label: 'Role' },
            { key: 'skills', label: 'Skills', sortable: false, csv: (p) => p.skills.join('; '), render: (p) => <><Skills list={p.skills} active={f.skill} /><span className="sub2">{p.minLevel}+</span></> },
            { key: 'slots', label: 'Slots', value: (p) => p.headcount, csv: (p) => p.slots.map((s) => SLOT[slotKind(s)].label).join('; '), render: (p) => <span style={{ whiteSpace: 'nowrap' }}>{p.slots.filter((s) => slotKind(s) === 'filled').length} / {p.headcount} filled</span> },
            { key: 'recruiters', label: 'Recruiters', sortable: false, csv: (p) => p.recruiters.join('; '), render: (p) => p.recruiters.join(', ') || '–' },
            { key: 'manager', label: 'Hiring manager' },
            { key: 'priority', label: 'Priority', value: (p) => PRIORITY_ORDER.indexOf(p.priority), csv: (p) => PRIORITY[p.priority], render: (p) => <span style={{ display: 'inline-flex', gap: 4, alignItems: 'center', fontWeight: p.priority === 'critical' ? 600 : 400 }}>{p.priority === 'critical' && <Icon name="alert" size={12} style={{ color: 'var(--red)' }} />}{PRIORITY[p.priority]}</span> },
            { key: 'status', label: 'Status', value: (p) => POS_STATUS_ORDER.indexOf(p.status), csv: (p) => POS_STATUS[p.status].label, render: (p) => <Badge cls={POS_STATUS[p.status].cls} icon={POS_STATUS[p.status].icon}>{POS_STATUS[p.status].label}</Badge> },
            { key: 'neededBy', label: 'Needed by', value: (p) => (['fulfilled', 'closed'].includes(p.status) ? 'z' : '') + p.neededBy, csv: (p) => p.neededBy,
              render: (p) => p.od ? <span style={{ color: p.od === 'red' ? 'var(--red)' : 'var(--amber)', fontWeight: 600, display: 'inline-flex', gap: 4, alignItems: 'center' }}><Icon name={p.od === 'red' ? 'alert' : 'clock'} size={12} />{fmtDate(p.neededBy)}</span> : fmtDate(p.neededBy) },
          ]} />
      </Panel>
    </>
  );
}

/* ----------------------------- Deploy Cost (FY) ----------------------------- */
function DeployCostView({ idx, f, people, fyId, setFyId }) {
  const [empStatus, setEmpStatus] = useState('active');   // the app's Employee Status filter defaults to Active
  const [bucket, setBucket] = useState(null);
  const [monthDrill, setMonthDrill] = useState(null);
  useEffect(() => { setBucket(null); setMonthDrill(null); }, [resetOn(f), fyId, empStatus]);

  const fy = DEPLOY_FYS.find((x) => x.id === fyId);
  const fyName = fy.label.replace(' (Current)', '');
  const { rows, months, workingDays, from } = useMemo(() => deployCost(idx, people, fy, empStatus), [idx, people, fy, empStatus]);
  const total = rows.reduce((s, r) => s + r.cost, 0);
  const avgDays = rows.length ? rows.reduce((s, r) => s + r.days, 0) / rows.length : 0;
  const monthsSoFar = months.filter((m) => m.cost > 0).length;   // app: total over the months that had any cost
  const tableRows = rows.filter((r) => (!bucket || r.bucket === bucket) && (!monthDrill || r.perMonth.get(monthDrill)));
  const pieData = DEPLOY_BUCKETS.map((b) => {
    const m = rows.filter((r) => r.bucket === b.key);
    return { key: b.key, label: b.label + ', ' + b.severity.toLowerCase(), color: b.color, value: m.reduce((s, r) => s + r.cost, 0), note: m.length + (m.length === 1 ? ' person' : ' people'), extra: [['People', m.length]] };
  });

  return (
    <>
      <div className="filters" style={{ marginTop: -4 }}>
<span className="field"><label htmlFor="dfy">Financial year</label><select id="dfy" value={fyId} onChange={(e) => setFyId(e.target.value)}>{FYS.map((x) => <option key={x.id} value={x.id}>{x.label}</option>)}</select></span>
        <span className="field"><label>Employee status</label><select aria-label="Employee status" value={empStatus} onChange={(e) => setEmpStatus(e.target.value)}><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option></select></span>
        <span className="sub2" style={{ marginLeft: 'auto' }}>{fy.start} – {fy.end}</span>
      </div>
      <PeriodBar>A day counts as undeployed when the person has no allocation at all that day, costed at their hourly cost x 8 hours.
        {fy.end > AS_OF ? ` Figures run to ${fmtDate(AS_OF, true)}.` : ''}{from > fy.start ? ` Demo records start ${fmtDate(from, true)}, so only ${workingDays} working days of ${fyName} are covered.` : ''}</PeriodBar>
      {!rows.length ? <div className="panel"><div className="state"><h3>No deploy cost for these filters</h3><p>{empStatus === 'inactive' ? 'Nobody who has left had an undeployed working day in this financial year. Try another year or set Employee status to All.' : 'No one had an undeployed working day in this selection. Try another financial year or Employee status.'}</p></div></div> : (<>
      <Kpis scope="bench_cost" items={[
        { label: 'Total deploy cost', value: fmtUSDShort(total), sub: <span className="dim">{fmtUSD(total)}</span> },
        { label: 'Headcount', value: rows.length, sub: <span className="dim">billable, underutilised</span> },
        { label: 'Avg undeployed days', value: avgDays.toFixed(1), unit: 'days', sub: <span className="dim">per employee</span> },
        { label: 'Avg monthly cost', value: fmtUSDShort(total / Math.max(1, monthsSoFar)), sub: <span className="dim">per month</span> },
      ]} />
      <div className="row half">
        <Panel title={`Monthly deploy cost (${fyName})`} note="Cost of undeployed working days in each month. Click a month to list the people behind it.">
          <div className="chart clickable"><ResponsiveContainer>
            <BarChart data={months} margin={{ top: 18, right: 8, bottom: 0, left: 0 }} barCategoryGap="22%">
              {hGrid}
              <XAxis dataKey="label" {...axis} interval={0} />
              <YAxis {...axis} tickFormatter={(v) => fmtUSDShort(v)} width={52} />
              <Tooltip cursor={barCursor} content={<Tip title={(d) => monthName(d.key)} rows={(d) => d.start > AS_OF ? [['Not reached yet', '']] : [['Deploy cost', fmtUSD(d.cost), '#9C4BE6'], ['People undeployed', d.headcount]]} />} />
              <Bar dataKey="cost" radius={[4, 4, 0, 0]} maxBarSize={44} isAnimationActive={false} onClick={(d) => d.payload.cost && setMonthDrill(monthDrill === d.payload.key ? null : d.payload.key)}>
                {months.map((m) => <Cell key={m.key} fill="#9C4BE6" fillOpacity={monthDrill && monthDrill !== m.key ? 0.35 : 1} />)}
                <LabelList dataKey="cost" position="top" formatter={(v) => (v ? fmtUSDShort(v) : '')} style={{ fontSize: 11, fill: '#3D4466' }} />
              </Bar>
            </BarChart>
          </ResponsiveContainer></div>
        </Panel>
        <Panel title="Undeployed duration breakdown" note="Share of deploy cost by each person's total undeployed days in the FY. Green is low, amber needs watching, orange is high, red is critical. Click a slice or a band to filter the table.">
          <Donut pie unitLabel="Deploy cost" format={(v) => fmtUSD(v)} active={bucket} onSelect={setBucket} data={pieData} />
        </Panel>
      </div>
      <Panel title={`Ready to deploy detail, ${tableRows.length} ${tableRows.length === 1 ? 'employee' : 'employees'}`} note="Click a row for the month-by-month breakdown."
        tools={<>{bucket && <Chip onClear={() => setBucket(null)}>{DEPLOY_BUCKETS.find((b) => b.key === bucket).label}</Chip>}{monthDrill && <Chip onClear={() => setMonthDrill(null)}>Undeployed in {monthName(monthDrill)}</Chip>}</>}>
        <DataTable csvName={`deploy-cost-${fyId}`} rows={tableRows} initialSort={{ key: 'cost', dir: 'desc' }} empty="No one with undeployed time in this selection"
          expand={(r) => <div className="slots">{months.filter((m) => r.perMonth.get(m.key)).map((m) => <div className="slot" key={m.key}><span className="n num">{r.perMonth.get(m.key)} d</span><span>{monthName(m.key)}</span><span className="sub2">{fmtUSD(r.perMonth.get(m.key) * (r.employee.hourlyCost || 0) * HOURS_PER_DAY)}</span></div>)}</div>}
          columns={[
            { key: 'name', label: 'Employee', value: (r) => r.employee.name, render: (r) => <Person e={r.employee} sub={r.employee.role} /> },
            { key: 'team', label: 'Dept' },
            { key: 'skills', label: 'Skills', sortable: false, csv: (r) => r.employee.skills.map((s) => s.skill).join('; '), render: (r) => <Skills list={r.employee.skills.map((s) => s.skill)} active={f.skill} /> },
            { key: 'days', label: 'Undeployed days', align: 'right' },
            { key: 'pct', label: 'Undeployed %', align: 'right', csv: (r) => r.pct.toFixed(1), render: (r) => <Pct v={r.pct} tone={toneLow(r.pct)} digits={1} /> },
            { key: 'cost', label: 'Deploy cost', align: 'right', render: (r) => r.noCost ? <span className="sub2">No cost set</span> : <b>{fmtUSD(r.cost)}</b>, csv: (r) => Math.round(r.cost) },
          ]} />
      </Panel>
      </>)}
    </>
  );
}

/* ----------------------------- Intern Investment ----------------------------- */
function InternView({ idx, f, fyId, setFyId }) {
  const [empStatus, setEmpStatus] = useState('active');   // the app's Employee Status filter defaults to Active
  const [status, setStatus] = useState(null);
  const [skillDrill, setSkillDrill] = useState(null);
  useEffect(() => { setStatus(null); setSkillDrill(null); }, [resetOn(f), fyId, empStatus]);

  const fy = INTERN_FYS.find((x) => x.id === fyId);
  const { rows, months, bySkill, from, to } = useMemo(() => internInvestment(idx, f, fy, empStatus), [idx, f, fy, empStatus]);
  const total = rows.reduce((s, r) => s + r.cost, 0);
  const converted = rows.filter((r) => r.intern.status === 'converted');
  const maxSkill = Math.max(1, ...bySkill.map((s) => s.investment));
  const tableRows = rows.filter((r) => (!status || r.intern.status === status) && (!skillDrill || r.intern.skill === skillDrill));

  return (
    <>
      <div className="filters" style={{ marginTop: -4 }}>
<span className="field"><label htmlFor="ify">Financial year</label><select id="ify" value={fyId} onChange={(e) => setFyId(e.target.value)}>{FYS.map((x) => <option key={x.id} value={x.id}>{x.label}</option>)}</select></span>
        <span className="field"><label>Employee status</label><select aria-label="Employee status" value={empStatus} onChange={(e) => setEmpStatus(e.target.value)}><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option></select></span>
        <span className="sub2" style={{ marginLeft: 'auto' }}>{from} – {to}</span>
      </div>
      <PeriodBar>Cost is stipend for the days each person was an intern in {fy.label.replace(' (Current)', '')}; converted interns stop counting on their conversion date.{fy.end > AS_OF ? ` Figures run to ${fmtDate(AS_OF, true)}.` : ''}</PeriodBar>
      {!rows.length ? <div className="panel"><div className="state"><h3>No interns for these filters</h3><p>Try another financial year, set Employee status to All, or clear the team, skill or search filter.</p></div></div> : (<>
      <Kpis scope="intern_investment" items={[
        { label: 'Total investment', value: fmtUSDShort(total), sub: <span className="dim">{fmtUSD(total)}</span> },
        { label: 'Interns onboarded', value: rows.length, sub: <span className="dim">in this FY</span> },
        { label: 'Avg per intern', value: fmtUSDShort(total / rows.length), sub: <span className="dim">stipend over their time in the FY</span> },
        { label: 'Conversion yield', value: <span style={{ color: converted.length ? 'var(--green)' : 'inherit' }}>{converted.length} ({fmtPct((converted.length / rows.length) * 100)})</span>, sub: <span className="dim">interns converted to full-time</span> },
      ]} />
      <div className="row half">
        <Panel title={`Monthly investment (${fy.label.replace(' (Current)', '')})`} note="Stipend spend in each month of the financial year. Hover a month for the number of interns.">
          <div className="chart"><ResponsiveContainer>
            <BarChart data={months} margin={{ top: 18, right: 8, bottom: 0, left: 0 }} barCategoryGap="22%">
              {hGrid}
              <XAxis dataKey="label" {...axis} interval={0} />
              <YAxis {...axis} tickFormatter={(v) => fmtUSDShort(v)} width={52} />
              <Tooltip cursor={barCursor} content={<Tip title={(d) => monthName(d.key)} rows={(d) => d.start > AS_OF ? [['Not reached yet', '']] : [['Investment', fmtUSD(d.investment), '#9C4BE6'], ['Interns', d.active]]} />} />
              <Bar dataKey="investment" fill="#9C4BE6" radius={[4, 4, 0, 0]} maxBarSize={44} isAnimationActive={false}>
                <LabelList dataKey="investment" position="top" formatter={(v) => (v ? fmtUSDShort(v) : '')} style={{ fontSize: 11, fill: '#3D4466' }} />
              </Bar>
            </BarChart>
          </ResponsiveContainer></div>
        </Panel>
        <Panel title="Investment by skill" note="Click a skill to filter the table.">
          <ul className="skill-bars">
            {bySkill.map((s) => (
              <li key={s.skill}><button type="button" aria-pressed={skillDrill === s.skill} onClick={() => setSkillDrill(skillDrill === s.skill ? null : s.skill)}>
                <span className="sb-top"><span className="sb-name">{s.skill}</span><span className="sub2">{s.count} {s.count === 1 ? 'intern' : 'interns'}</span><b className="num">{fmtUSD(s.investment)}</b></span>
                <span className="sb-track"><i style={{ width: `${(s.investment / maxSkill) * 100}%`, opacity: skillDrill && skillDrill !== s.skill ? 0.35 : 1 }} /></span>
              </button></li>))}
          </ul>
        </Panel>
      </div>
      <Panel title={`Intern detail, ${tableRows.length} ${tableRows.length === 1 ? 'intern' : 'interns'}`} note="Utilisation is the share of their intern days booked on project work."
        tools={<><Seg small label="Intern status" options={[['', 'All'], ['active', 'Active'], ['converted', 'Converted'], ['exited', 'Exited']].filter(([k]) => !k || rows.some((r) => r.intern.status === k))} value={status || ''} onChange={(v) => setStatus(v || null)} />
          {skillDrill && <Chip onClear={() => setSkillDrill(null)}>{skillDrill}</Chip>}</>}>
        <DataTable csvName={`intern-investment-${fyId}`} rows={tableRows} initialSort={{ key: 'cost', dir: 'desc' }} empty="No interns in this selection" columns={[
          { key: 'name', label: 'Name', value: (r) => r.intern.name, render: (r) => <Person e={r.intern} sub={r.team} /> },
          { key: 'skill', label: 'Skill', value: (r) => r.intern.skill, render: (r) => <span className="skill">{r.intern.skill}</span> },
          { key: 'joined', label: 'Joined', value: (r) => r.intern.joined, render: (r) => fmtDate(r.intern.joined, true) },
          { key: 'allocDays', label: 'Alloc days', align: 'right' },
          { key: 'utilization', label: 'Utilisation', align: 'right', csv: (r) => r.utilization, render: (r) => <Pct v={r.utilization} tone={toneHigh(r.utilization)} digits={1} /> },
          { key: 'cost', label: 'Total cost', align: 'right', render: (r) => <b>{fmtUSD(r.cost)}</b>, csv: (r) => Math.round(r.cost) },
          { key: 'status', label: 'Status', value: (r) => r.intern.status, csv: (r) => INTERN_STATUS[r.intern.status].label,
            render: (r) => <span><Badge cls={INTERN_STATUS[r.intern.status].cls} icon={INTERN_STATUS[r.intern.status].icon}>{INTERN_STATUS[r.intern.status].label}</Badge>{r.intern.end && <span className="sub2" style={{ marginLeft: 6 }}>{fmtDate(r.intern.end)}</span>}</span> },
        ]} />
      </Panel>
      </>)}
    </>
  );
}

/* ----------------------------- MBR ----------------------------- */
function MBRView({ idx, f, people }) {
  const [month, setMonth] = useState(AS_OF.slice(0, 7));
  const months = fyMonths(fyOf(month + '-01'));   // the trend covers the selected month's financial year
  const [status, setStatus] = useState(null);
  const [typeF, setTypeF] = useState('');
  const [q, setQ] = useState('');
  const [buF, setBuF] = useState('');
  const [excluded, setExcluded] = useState(() => new Set());
  const exKey = [...excluded].sort().join(',');

  const bus = idx.data.businessUnits;
  const data = useMemo(() => mbrMonth(idx, month, people, f), [idx, month, people, f]);
  const keep = (r) => (!typeF || r.type === typeF) && !excluded.has(r.category);
  const all = data.rows.filter(keep);
  const trend = useMemo(() => months.map((m) => {
    const rs = mbrMonth(idx, m.key, people, f).rows.filter((r) => keep(r) && modeOf(r.category) !== 'excluded');   // counted people, as the cards
    return { key: m.key, label: m.label, billable: rs.filter((r) => r.status === 'billable').length, partially_billable: rs.filter((r) => r.status === 'partially_billable').length, not_billable: rs.filter((r) => r.status === 'not_billable').length };
  }), [idx, people, f, typeF, months[0].key, exKey]);
  // As in the app's capacity modes: Support and FLIP are not counted; interns count against their own booked hours.
  const counted = all.filter((r) => modeOf(r.category) !== 'excluded');
  const paid = counted.reduce((s, r) => s + (modeOf(r.category) === 'allocated_only' ? (r.total / 100) * r.capHours : r.capHours), 0);
  const avgUtil = paid ? Math.round((counted.reduce((s, r) => s + (r.total / 100) * r.capHours, 0) / paid) * 1000) / 10 : null;
  const over = all.filter((r) => r.total > 100);
  const rtdAt = lastWorkday(idx, minS(maxS(AS_OF, data.start), data.end));   // one day: today in the current month, else the month's last day
  const rtd = rtdAt ? all.filter((r) => (r.category === 'delivery' || r.category === 'supervisory') && pctOn(idx, r.id, rtdAt) <= RTD_DEFAULT) : [];
  const noClient = counted.filter((r) => r.status === 'not_billable');
  const fully = counted.filter((r) => r.status === 'billable').length, partly = counted.filter((r) => r.status === 'partially_billable').length;
  const actualHours = all.reduce((s, r) => s + r.actualHours, 0);
  const filed = all.filter((r) => r.filed).length;
  const ql = q.trim().toLowerCase();
  const tableRows = all.filter((r) => (!status || r.status === status) && (!buF || (buF === 'internal' ? r.internal > 0 : r.bu[buF] > 0)) &&
    (!ql || r.name.toLowerCase().includes(ql) || r.code.toLowerCase().includes(ql)));
  const exLabel = excluded.size ? `Excluding ${excluded.size}: ${Object.keys(CATEGORY_LABEL).filter((c) => excluded.has(c)).map((c) => CATEGORY_LABEL[c]).join(', ')}` : 'Excluding none';
  const pctCell = (v) => <span style={{ color: v ? 'var(--ink)' : 'var(--muted)' }}>{fmtPct(v)}</span>;

  return (
    <>
      <div className="filters" style={{ marginTop: -4 }}>
<span className="field"><label htmlFor="mbrm">Month</label><input id="mbrm" type="month" min={DATA_START.slice(0, 7)} max={AS_OF.slice(0, 7)} value={month} onChange={(e) => e.target.value && setMonth(minS(maxS(e.target.value, '2020-04'), AS_OF.slice(0, 7)))} /></span>
        <span className="sub2">{monthName(month)}, {data.days} working days, full month.</span>
      </div>
      <Kpis scope="mbr" items={[
        { label: 'Avg utilization', value: avgUtil == null ? '–' : avgUtil.toFixed(1) + '%', tone: toneLoad(avgUtil), sub: <span className="dim">{counted.length} counted, {all.length - counted.length} not counted</span> },
        { label: 'Headcount', value: all.length, sub: <span className="dim">employed in the month</span> },
        { label: 'Billable', value: fully + partly, sub: <span className="dim">counted, {fully} fully, {partly} partly</span> },
        { label: 'No client work', value: noClient.length, sub: <span className="dim">counted, staffable</span> },
        { label: 'Ready to deploy', value: rtd.length, sub: <span className="dim">≤{RTD_DEFAULT}% as of {rtdAt ? fmtDate(rtdAt) : '–'}</span> },
        { label: 'Over allocated', value: over.length, sub: <span className="dim">above 100% for the month</span> },
        { label: 'Actual hours', value: fmtN(actualHours) + ' h', sub: <span className="dim">{filed} of {all.length} fully filed</span> },
      ]} />
      {all.length > 0 && <div className="hint" style={{ marginTop: -6, marginBottom: 14 }}>Avg utilization is hours-weighted over the {counted.length} counted people across all of {monthName(month)}; interns count against their own booked hours. Ready to deploy is a single day{rtdAt ? ` (${fmtDate(rtdAt, true)})` : ''}, Delivery and Supervisory only, matching that report. The billable counts cover the counted people; the other {all.length - counted.length} (Support and FLIP) have rows but are not counted.</div>}
      <div className="row main">
        <Panel title="Billable people each month" note="Out of the counted people (everyone except Support and FLIP), how many were on client work each month. Click a month to see it below.">
          {(() => {
            const BILL = [['billable', 'Fully billable', '#0D9458'], ['partially_billable', 'Partly billable', '#C47E00'], ['not_billable', 'No client work', '#D13C2C']];
            const share = trend.map((t) => { const n = t.billable + t.partially_billable + t.not_billable; const pc = (k) => (n ? (t[k] / n) * 100 : 0); return { ...t, n, p_billable: pc('billable'), p_partially_billable: pc('partially_billable'), p_not_billable: pc('not_billable') }; });
            return (<>
              <Legend items={BILL.map(([, label, color]) => ({ label, color }))} />
              <div className="chart clickable"><ResponsiveContainer>
                <BarChart data={share} margin={{ top: 8, right: 8, bottom: 0, left: -12 }} barCategoryGap="24%">
                  {hGrid}
                  <XAxis dataKey="label" {...axis} interval={0} />
                  <YAxis {...axis} domain={[0, 100]} ticks={[0, 25, 50, 75, 100]} tickFormatter={(v) => v + '%'} />
                  <Tooltip cursor={barCursor} content={<Tip title={(d) => monthName(d.key)} rows={(d) => BILL.map(([k, label, color]) => [label, fmtPct(d['p_' + k]) + ' (' + d[k] + ')', color]).concat([['Counted people', d.n]])} />} />
                  {BILL.map(([k, , color], i) => (
                    <Bar key={k} dataKey={'p_' + k} stackId="b" fill={color} stroke="#fff" strokeWidth={2} radius={i === BILL.length - 1 ? [4, 4, 0, 0] : 0} maxBarSize={56} isAnimationActive={false} onClick={(d) => setMonth(d.payload.key)}>
                      {share.map((m) => <Cell key={m.key} fillOpacity={m.key === month ? 1 : 0.45} />)}
                      <LabelList dataKey={'p_' + k} content={({ x, y, width, height, value, index }) => value >= 9 && height >= 16 ? <text x={x + width / 2} y={y + height / 2 + 4} textAnchor="middle" fontSize={11} fontWeight={600} fill={share[index] && share[index].key === month ? '#fff' : '#0F1333'}>{fmtPct(value)}</text> : null} />
                    </Bar>
                  ))}
                </BarChart>
              </ResponsiveContainer></div>
              <div className="hint">The month shown below is in full colour. Green is good, amber is partly on client work, red is no client work.</div>
            </>);
          })()}
        </Panel>
        <Panel title="Needs attention" note="Click to filter the grid.">
          <Attention groups={[
            { title: 'No client work this month', items: noClient.map((r) => ({ key: r.id, who: r.name, why: `${r.type}, ${r.team}, ${fmtPct(r.internal)} internal`, fig: fmtPct(r.ready) + ' free', icon: 'alert', color: 'var(--amber)', active: status === 'not_billable', onClick: () => setStatus('not_billable') })) },
            { title: 'Over-allocated', items: over.map((r) => ({ key: r.id + 'o', who: r.name, why: `${fmtPct(r.billable)} billable, ${fmtPct(r.internal)} internal`, fig: fmtPct(r.total), icon: 'up', color: 'var(--red)' })) },
          ]} />
        </Panel>
      </div>
      <Panel title={`Employee billable status, ${monthName(month)}`} note="Business unit columns show each person's share of the month on that unit's client projects. Check is the total allocation."
>
        <div className="filters">
          <span className="field"><input type="search" aria-label="Search name or Emp ID" placeholder="Search name or Emp ID…" value={q} onChange={(e) => setQ(e.target.value)} /></span>
          <span className="field"><select aria-label="Billable status" value={status || ''} onChange={(e) => setStatus(e.target.value || null)}><option value="">All billable statuses</option>{Object.entries(MBR_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></span>
          <span className="field"><select aria-label="Type" value={typeF} onChange={(e) => setTypeF(e.target.value)}><option value="">All types</option><option>FTE</option><option>Contract</option><option>Intern</option></select></span>
          <details className="field excl"><summary>{exLabel} <Icon name="down" size={11} /></summary>
            <div className="excl-pop">{Object.entries(CATEGORY_LABEL).map(([k, label]) => (
              <label key={k}><input type="checkbox" checked={excluded.has(k)} onChange={() => setExcluded((cur) => { const n = new Set(cur); n.has(k) ? n.delete(k) : n.add(k); return n; })} />{label}</label>))}
              {excluded.size > 0 && <button className="btn ghost sm" type="button" onClick={() => setExcluded(new Set())}>Include everyone</button>}</div>
          </details>
          <span className="field"><select aria-label="Business unit" value={buF} onChange={(e) => setBuF(e.target.value)}><option value="">All business units</option>{bus.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}<option value="internal">Internal</option></select></span>
          <span className="sub2">{tableRows.length} of {data.rows.length}</span>
        </div>
        <DataTable csvName={`mbr-${month}`} rows={tableRows} initialSort={{ key: 'status', dir: 'asc' }} pageSize={15} empty="No people match these filters for this month" columns={[
          { key: 'code', label: 'Emp ID', render: (r) => <span className="sub2" style={{ color: 'var(--ink-2)' }}>{r.code}</span> },
          { key: 'name', label: 'Employee name', render: (r) => <Person e={r} sub={r.team} /> },
          { key: 'type', label: 'FTE/Contract/Intern' },
          { key: 'status', label: 'Billable status', value: (r) => Object.keys(MBR_STATUS).indexOf(r.status), csv: (r) => MBR_STATUS[r.status].label, render: (r) => <Badge cls={MBR_STATUS[r.status].cls} icon={MBR_STATUS[r.status].icon}>{MBR_STATUS[r.status].label}</Badge> },
          ...bus.map((b) => ({ key: 'bu_' + b.id, label: b.name, align: 'right', value: (r) => r.bu[b.id], csv: (r) => Math.round(r.bu[b.id]), render: (r) => pctCell(r.bu[b.id]) })),
          { key: 'internal', label: '% of internal', align: 'right', csv: (r) => Math.round(r.internal), render: (r) => pctCell(r.internal) },
          { key: 'ready', label: 'Ready to be utilized %', align: 'right', csv: (r) => Math.round(r.ready), render: (r) => pctCell(r.ready) },
          { key: 'total', label: 'Check', align: 'right', csv: (r) => Math.round(r.total), render: (r) => <Pct v={r.total} tone={toneLoad(r.total)} /> },
        ]} />
      </Panel>
    </>
  );
}

/* ----------------------------- Salary Bands ----------------------------- */
function SalaryView({ idx, f, people }) {
  const [draft, setDraft] = useState(SALARY_DEFAULTS);
  const [applied, setApplied] = useState(SALARY_DEFAULTS);
  const role = ALL;
  const [proj, setProj] = useState(ALL);   // whole organisation, or the people on one active project today
  const staff = proj === ALL ? people : people.filter((e) => currentProjects(idx, e.id, AS_OF).some((c) => c.project.id === proj));
  const [band, setBand] = useState(null);
  useEffect(() => setBand(null), [resetOn(f), proj]);

  const rows = useMemo(() => salaryBands(idx, staff, applied, proj), [idx, staff, applied, proj]);
  const roles = [...new Set(rows.map((r) => r.role))];
  const shown = rows.filter((r) => !r.hidden && (role === ALL || r.role === role) && (!band || r.bandKey === band));
  const hidden = rows.filter((r) => r.hidden && (role === ALL || r.role === role));
  const scope = staff.filter((e) => !e.left && e.category !== 'support' && (role === ALL || ROLE_FAMILY[e.teamId] === role));
  const costed = scope.filter((e) => e.hourlyCost > 0);
  const avgCost = costed.length ? costed.reduce((s, e) => s + e.hourlyCost, 0) / costed.length : null;
  const ladder = EXP_BANDS.map((b) => {
    const m = costed.filter((e) => bandOf(e.expYears)[0] === b[0]);
    const cost = m.length >= MIN_BAND ? m.reduce((s, e) => s + e.hourlyCost, 0) / m.length : null;
    return { key: b[0], label: b[1], people: m.length, cost, margin: cost != null ? cost / (applied.share / 100) - cost : null };
  });
  const valid = draft.share >= 1 && draft.share <= 99 && draft.hours >= 1 && draft.hours <= 744 && draft.fx > 0;
  const changed = JSON.stringify(draft) !== JSON.stringify(applied);
  const num = (k, label, step, hint) => (
    <span className="field"><label htmlFor={'sb-' + k}>{label}</label><input id={'sb-' + k} type="number" step={step} value={draft[k]} style={{ width: 70 }} onChange={(e) => setDraft({ ...draft, [k]: Number(e.target.value) })} title={hint} /></span>
  );

  return (
    <>
      <div className="filters" style={{ marginTop: -4 }}>
        <span className="field"><label htmlFor="sbproj">Projects</label><select id="sbproj" value={proj} onChange={(e) => setProj(e.target.value)}><option value={ALL}>Whole organisation</option>{idx.data.projects.filter((x) => projectStatus(x, AS_OF) === 'active').map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}</select></span>
        {num('share', 'Salary share %', 1, 'Salary as a share of the bill rate: 1 to 99')}
        {num('hours', 'Hours / month', 1, 'Billable hours per month: 1 to 744')}
        {num('fx', '₹ per $', 0.5, 'Exchange rate used for salaries in rupees')}
        <button className="btn" type="button" disabled={!valid || !changed} onClick={() => setApplied(draft)}>Apply</button>
        {JSON.stringify(applied) !== JSON.stringify(SALARY_DEFAULTS) && <button className="btn ghost" type="button" onClick={() => { setDraft(SALARY_DEFAULTS); setApplied(SALARY_DEFAULTS); }}><Icon name="reset" size={13} />Back to defaults</button>}
        {!valid && <span className="sub2" style={{ color: 'var(--red)' }}>Salary share must be 1–99%, hours 1–744 and the rate above 0.</span>}
      </div>
      <PeriodBar>Averages only, as of {fmtDate(AS_OF, true)}. Experience is prior experience plus time since joining. Bands with fewer than {MIN_BAND} costed people are not shown, so no one's pay can be read off.</PeriodBar>
      <Kpis scope="salary_bands" items={[
        { label: 'People costed', value: costed.length, unit: `of ${scope.length}`, sub: <span className="dim">{scope.length - costed.length} without an hourly cost</span> },
        { label: 'Avg cost', value: avgCost != null ? `$${avgCost.toFixed(1)}` : '–', unit: '/hr', sub: <span className="dim">{role === ALL ? 'all roles' : role}</span> },
        { label: 'Target bill rate', value: avgCost != null ? `$${(avgCost / (applied.share / 100)).toFixed(1)}` : '–', unit: '/hr', sub: <span className="dim">cost at a {applied.share}% salary share</span> },
        { label: 'Avg monthly salary', value: avgCost != null ? fmtINR(avgCost * applied.hours * applied.fx) : '–', sub: <span className="dim">{applied.hours} h at ₹{applied.fx} per $</span> },
      ]} />
      <div className="row main">
        <Panel title="Margin at each band" note={'Each bar runs from the average cost to the target bill rate at a ' + applied.share + '% salary share; its length is the margin per hour. Click a bar to filter the table.'}>
          {(() => {
            const bars = shown.map((r) => ({ id: r.id, label: r.role + ', ' + r.bandLabel, cost: r.cost, span: r.margin, bill: r.bill, headcount: r.headcount, bandKey: r.bandKey }));
            if (!bars.length) return <div className="state"><h3>No band has enough costed people for this filter</h3></div>;
            const max = Math.ceil(Math.max(...bars.map((b) => b.bill)) / 10) * 10 + 10;
            return (
              <div className="clickable" style={{ height: bars.length * 30 + 36 }}><ResponsiveContainer>
                <BarChart data={bars} layout="vertical" margin={{ top: 0, right: 56, bottom: 0, left: 0 }} barCategoryGap={7}>
                  <CartesianGrid stroke="#EEEEF8" horizontal={false} />
                  <XAxis type="number" domain={[0, max]} tickFormatter={(v) => '$' + v} {...axis} />
                  <YAxis type="category" dataKey="label" {...axis} width={190} />
                  <Tooltip cursor={barCursor} content={<Tip title={(d) => d.label + ', ' + d.headcount + ' people'} rows={(d) => [['Avg cost', '$' + d.cost.toFixed(2) + '/hr'], ['Target bill rate', '$' + d.bill.toFixed(2) + '/hr', '#9C4BE6'], ['Margin', '$' + d.span.toFixed(2) + '/hr']]} />} />
                  <Bar dataKey="cost" stackId="m" fill="transparent" isAnimationActive={false}>
                    <LabelList dataKey="cost" position="insideRight" formatter={(v) => '$' + v.toFixed(0)} style={{ fontSize: 11, fill: '#6B7399' }} />
                  </Bar>
                  <Bar dataKey="span" stackId="m" radius={4} maxBarSize={14} isAnimationActive={false} onClick={(d) => setBand(band === d.payload.bandKey ? null : d.payload.bandKey)}>
                    {bars.map((b) => <Cell key={b.id} fill="#9C4BE6" fillOpacity={band && band !== b.bandKey ? 0.3 : 1} />)}
                    <LabelList dataKey="bill" position="right" formatter={(v) => '$' + v.toFixed(0)} style={{ fontSize: 11.5, fill: '#0F1333', fontWeight: 600 }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer></div>
            );
          })()}
        </Panel>
        <Panel title="Needs attention">
          <Attention groups={[
            { title: 'Data gaps', items: rows.filter((r) => (role === ALL || r.role === role) && (r.missingCost || r.missingPrior)).map((r) => ({ key: r.id, who: r.role + ', ' + r.bandLabel, why: [r.missingCost && r.missingCost + ' without an hourly cost', r.missingPrior && r.missingPrior + ' without prior experience'].filter(Boolean).join(', '), fig: String(r.missingCost + r.missingPrior), icon: 'alert', color: 'var(--amber)' })) },
            { title: 'Hidden to protect individual pay', items: hidden.length ? [{ key: 'hidden', who: hidden.length + ' bands with fewer than ' + MIN_BAND + ' costed people', why: 'Listed under the table.', fig: hidden.reduce((t, r) => t + r.headcount, 0) + ' people', icon: 'user', color: 'var(--ink-2)' }] : [] },
          ]} />
        </Panel>
      </div>
      <Panel title="Salary bands by role and experience" note="Target bill rate = average cost / salary share. Monthly salary = average cost x hours per month x rupees per dollar."
        tools={<>{band && <Chip onClear={() => setBand(null)}>{EXP_BANDS.find((b) => b[0] === band)[1]}</Chip>}</>}>
        <DataTable csvName="salary-bands" rows={shown} initialSort={{ key: 'role', dir: 'asc' }} pageSize={20} empty="No band has enough costed people for this filter" columns={[
          { key: 'role', label: 'Role', value: (r) => r.role + r.order, render: (r) => <b style={{ fontWeight: 600 }}>{r.role}</b>, csv: (r) => r.role },
          { key: 'bandLabel', label: 'Experience', value: (r) => r.order },
          { key: 'headcount', label: 'Headcount', align: 'right' },
          { key: 'cost', label: 'Avg cost $/hr', align: 'right', render: (r) => r.cost.toFixed(2), csv: (r) => r.cost.toFixed(2) },
          { key: 'bill', label: 'Target bill rate $/hr', align: 'right', render: (r) => r.bill.toFixed(2), csv: (r) => r.bill.toFixed(2) },
          { key: 'margin', label: 'Margin $/hr', align: 'right', render: (r) => r.margin.toFixed(2), csv: (r) => r.margin.toFixed(2) },
          { key: 'monthly', label: 'Avg monthly salary', align: 'right', render: (r) => fmtINR(r.monthly), csv: (r) => Math.round(r.monthly) },
          { key: 'annual', label: 'Avg annual salary', align: 'right', render: (r) => fmtINR(r.annual), csv: (r) => Math.round(r.annual) },
          { key: 'gaps', label: 'Data gaps', sortable: false, csv: (r) => [r.missingCost && `${r.missingCost} without cost`, r.missingPrior && `${r.missingPrior} without prior exp`].filter(Boolean).join('; '),
            render: (r) => (r.missingCost || r.missingPrior) ? <span className="sub2" style={{ color: 'var(--amber)' }}><Icon name="alert" size={12} style={{ verticalAlign: -2, marginRight: 4 }} />{[r.missingCost && `${r.missingCost} without cost`, r.missingPrior && `${r.missingPrior} without prior exp`].filter(Boolean).join(', ')}</span> : '–' },
        ]} />
        {hidden.length > 0 && <div className="hint">{hidden.length} small band{hidden.length > 1 ? 's' : ''} ({hidden.reduce((s, r) => s + r.headcount, 0)} people) not shown: {hidden.map((r) => `${r.role} ${r.bandLabel}`).join(', ')}.</div>}
      </Panel>
    </>
  );
}

/* ----------------------------- Realized Invoice Value ----------------------------- */
function InvoiceView({ idx, f, fyId, setFyId }) {
  const [mode, setMode] = useState('fy');   // app default: the current financial year
  const [monthKey, setMonthKey] = useState(AS_OF.slice(0, 7));
  const fy = mode === 'ytd' ? FYS[0] : mode === 'month' ? fyOf(monthKey + '-01') : FYS.find((x) => x.id === fyId);
  const period = mode === 'month' ? monthKey : 'fy';
  const months = fyMonths(fy);
  const allMonths = []; for (let m = AS_OF.slice(0, 7) + '-01'; m >= '2020-04-01'; m = addMonths(m, -1)) allMonths.push(m.slice(0, 7));
  const [stats, setStats] = useState([]);
  const [invStats, setInvStats] = useState([]);
  const [client, setClient] = useState(null);
  const [projF, setProjF] = useState(ALL);
  const flip = (list, set, k) => set(list.includes(k) ? list.filter((x) => x !== k) : [...list, k]);

  const scoped = useMemo(() => invoiceRows(idx, f, period, fy), [idx, f, period, fy]);
  const clientsAll = [...new Set(scoped.map((r) => r.project.client))].sort();
  const rows = scoped.filter((r) => (!client || r.project.client === client) && (projF === ALL || r.project.id === projF));
  const projected = rows.reduce((s, r) => s + r.projected, 0);
  const realised = rows.reduce((s, r) => s + r.realised, 0);
  const pending = rows.reduce((s, r) => s + r.pending, 0);
  const overdueAmt = rows.filter((r) => r.status === 'overdue' || (r.status === 'partial' && r.daysOverdue)).reduce((s, r) => s + (r.inv.invoiced - r.realised), 0);
  const byMonth = months.map((m) => { const rs = invoiceRows(idx, f, m.key, fy); return { key: m.key, label: m.label, projected: rs.reduce((s, r) => s + r.projected, 0), realised: rs.reduce((s, r) => s + r.realised, 0) }; });
  const clients = [...new Set(rows.map((r) => r.project.client))].map((c) => { const rs = rows.filter((r) => r.project.client === c); return { client: c, realised: rs.reduce((s, r) => s + r.realised, 0), pending: rs.reduce((s, r) => s + r.pending, 0) }; }).sort((a, b) => b.realised + b.pending - a.realised - a.pending);
  const tableRows = rows.filter((r) => (!stats.length || stats.includes(r.status)) && (!invStats.length || invStats.includes(r.inv.status)));
  const late = rows.filter((r) => r.daysOverdue > 0).sort((a, b) => b.daysOverdue - a.daysOverdue);
  // Project status (app): overdue if any row is; complete if all are; otherwise pending. Inactive = project not active.
  const projStats = (() => {
    const by = new Map(); for (const r of rows) (by.get(r.project.id) || by.set(r.project.id, []).get(r.project.id)).push(r);
    const st = [...by.values()].map((rs) => rs.some((r) => r.status === 'overdue') ? 'overdue' : rs.every((r) => r.status === 'complete') ? 'complete' : 'pending');
    return { n: by.size, complete: st.filter((x) => x === 'complete').length, pending: st.filter((x) => x === 'pending').length, overdue: st.filter((x) => x === 'overdue').length,
      inactive: [...by.keys()].filter((id) => projectStatus(idx.projectById.get(id), AS_OF) !== 'active').length };
  })();

  return (
    <>
      <div className="filters" style={{ marginTop: -4 }}>
<div className="seg" role="group" aria-label="Period">
          <button type="button" aria-pressed={mode === 'ytd'} onClick={() => setMode('ytd')} title="Year to date, Apr–Mar">YTD</button>
          <button type="button" aria-pressed={mode === 'month'} onClick={() => setMode('month')}>Month</button>
          <button type="button" aria-pressed={mode === 'fy'} onClick={() => setMode('fy')}>Financial year</button>
        </div>
        {mode === 'month' && <span className="field"><label htmlFor="invm">Month</label><select id="invm" value={monthKey} onChange={(e) => setMonthKey(e.target.value)}>{allMonths.map((m) => <option key={m} value={m}>{monthName(m)}</option>)}</select></span>}
        {mode === 'fy' && <span className="field"><label htmlFor="invfy">Financial year</label><select id="invfy" value={fyId} onChange={(e) => setFyId(e.target.value)}>{FYS.map((x) => <option key={x.id} value={x.id}>{x.label}</option>)}</select></span>}
        <span className="field"><label htmlFor="invc">Clients</label><select id="invc" value={client || ''} onChange={(e) => setClient(e.target.value || null)}><option value="">All clients</option>{clientsAll.map((c) => <option key={c}>{c}</option>)}</select></span>
        <span className="field"><label htmlFor="invpr">Projects</label><select id="invpr" value={projF} onChange={(e) => setProjF(e.target.value)}><option value={ALL}>All projects</option>{[...new Map(scoped.filter((r) => !client || r.project.client === client).map((r) => [r.project.id, r.project])).values()].map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}</select></span>
      </div>
      <div className="filters chips-row" role="group" aria-label="Status filter">
        <span className="chips-lbl">Status</span>
        {REALIZATION_ORDER.map((k) => <button key={k} type="button" className="fchip" aria-pressed={stats.includes(k)} onClick={() => flip(stats, setStats, k)}><span style={{ color: REALIZATION[k].color, display: 'inline-flex' }}><Icon name={REALIZATION[k].icon} size={12} /></span>{REALIZATION[k].label}</button>)}
        {stats.length > 0 && <button type="button" className="linkbtn" onClick={() => setStats([])}>Clear</button>}
      </div>
      <div className="filters chips-row" role="group" aria-label="Invoice status filter">
        <span className="chips-lbl">Invoice status</span>
        {Object.entries(INVOICE_STATUS).map(([k, label]) => <button key={k} type="button" className="fchip" aria-pressed={invStats.includes(k)} onClick={() => flip(invStats, setInvStats, k)}>{label}</button>)}
        {invStats.length > 0 && <button type="button" className="linkbtn" onClick={() => setInvStats([])}>Clear</button>}
      </div>
      {!rows.length ? <div className="panel"><div className="state"><h3>No client invoices for these filters</h3><p>Internal projects are not invoiced. Pick another period, client or project.</p></div></div> : (<>
      <Kpis scope="invoice_realization" items={[
        { label: 'Projected revenue', value: fmtUSDShort(projected), sub: <span className="dim">{fmtUSD(projected)}</span>, spark: period === 'fy' ? { data: byMonth, k: 'projected', color: '#3D4466' } : null },
        { label: 'Realised', value: fmtUSDShort(realised), tone: projected ? toneHigh((realised / projected) * 100) : null, sub: <><b className="num"><Pct v={projected ? (realised / projected) * 100 : null} tone={projected ? toneHigh((realised / projected) * 100) : null} /></b><span className="dim">of projected collected</span></>, spark: period === 'fy' ? { data: byMonth, k: 'realised', color: '#9C4BE6' } : null },
        { label: 'Pending', value: fmtUSDShort(pending), sub: overdueAmt ? <><Icon name="alert" size={12} /><b className="num">{fmtUSDShort(overdueAmt)}</b><span className="dim">invoiced and past due</span></> : <span className="dim">nothing past due</span> },
        { label: 'Projects', value: projStats.n, sub: <span className="dim">{projStats.complete} complete, {projStats.pending} pending, {projStats.overdue} overdue{projStats.inactive ? `, ${projStats.inactive} inactive` : ''}</span> },
      ]} />
      <div className="row main">
        <Panel title="Who owes us" note="Projected revenue per client, split into cash received, amounts not yet due and amounts past due. Click a bar to filter the table.">
          {(() => {
            const byClient = [...new Set(rows.map((r) => r.project.client))].map((c) => {
              const rs = rows.filter((r) => r.project.client === c);
              const overdue = rs.reduce((t, r) => t + (r.daysOverdue > 0 ? r.inv.invoiced - r.realised : 0), 0);
              const pend = rs.reduce((t, r) => t + r.pending, 0);
              return { client: c, received: rs.reduce((t, r) => t + r.realised, 0), overdue, notDue: Math.max(0, pend - overdue) };
            }).sort((a, b) => b.overdue - a.overdue || (b.received + b.notDue) - (a.received + a.notDue));
            const C = { received: ['Received', '#9C4BE6'], notDue: ['Not yet due', '#C3C6D9'], overdue: ['Past due', '#D13C2C'] };
            return (<>
              <Legend items={Object.values(C).map(([label, color]) => ({ label, color }))} />
              <div className="clickable" style={{ height: byClient.length * 40 + 34 }}><ResponsiveContainer>
                <BarChart data={byClient} layout="vertical" margin={{ top: 0, right: 20, bottom: 0, left: 0 }}>
                  {vGrid}
                  <XAxis type="number" {...axis} tickFormatter={(v) => fmtUSDShort(v)} />
                  <YAxis type="category" dataKey="client" {...axis} width={150} />
                  <Tooltip cursor={barCursor} content={<Tip title={(d) => d.client} rows={(d) => Object.keys(C).map((k) => [C[k][0], fmtUSD(d[k]), C[k][1]])} />} />
                  {Object.keys(C).map((k) => (
                    <Bar key={k} dataKey={k} stackId="c" fill={C[k][1]} stroke="#fff" strokeWidth={2} maxBarSize={20} isAnimationActive={false} onClick={(d) => setClient(client === d.payload.client ? null : d.payload.client)}>
                      {byClient.map((c) => <Cell key={c.client} fillOpacity={client && client !== c.client ? 0.3 : 1} />)}
                    </Bar>
                  ))}
                </BarChart>
              </ResponsiveContainer></div>
            </>);
          })()}
        </Panel>
        <Panel title="Needs attention" note="Click to filter the table.">
          <Attention groups={[
            { title: 'Invoices past due', items: late.map((r) => ({ key: r.id, who: `${r.project.name}, ${monthName(r.month)}`, why: `${r.inv.number}, ${fmtUSD(r.inv.invoiced - r.realised)} outstanding, ${r.project.client}`, fig: `${r.daysOverdue} d`, icon: 'alert', color: 'var(--red)', active: client === r.project.client, onClick: () => { setStats([]); setClient(r.project.client); } })) },
            { title: 'Not yet invoiced', items: rows.filter((r) => r.inv.status === 'not_invoiced').map((r) => ({ key: r.id + 'd', who: r.project.name, why: `${monthName(r.month)} work, invoice goes out after month end`, fig: fmtUSDShort(r.projected), icon: 'clock', color: 'var(--ink-2)' })), limit: 3 },
          ]} />
        </Panel>
      </div>
      <Panel title="Realized invoice value" note="One row per project per month. Click a row for the invoice."
>
        <DataTable csvName="realized-invoice-value" rows={tableRows} initialSort={{ key: 'month', dir: 'desc' }} pageSize={15} empty="No rows match these filters"
