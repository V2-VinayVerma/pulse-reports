          expand={(r) => r.inv.status === 'not_invoiced' ? <span className="sub2">Not invoiced yet. {monthName(r.month)} is still running; the invoice goes out after month end.</span>
            : r.inv.status === 'draft' ? <span className="sub2">Invoice {r.inv.number} drafted for {fmtUSD(r.inv.invoiced)}, not sent yet.</span> : (
            <div className="slots">
              <div className="slot"><span className="n">Invoice</span><span className="code">{r.inv.number}</span><span className="sub2">{INVOICE_STATUS[r.inv.status]}</span></div>
              <div className="slot"><span className="n">Dates</span><span>Sent {fmtDate(r.inv.date, true)}, due {fmtDate(r.inv.due, true)}</span><span className="sub2">{r.daysOverdue ? `${r.daysOverdue} days past due` : r.inv.status === 'paid' ? 'Paid' : 'Not due yet'}</span></div>
              <div className="slot"><span className="n">Amount</span><span>Invoiced {fmtUSD(r.inv.invoiced)}, received {fmtUSD(r.realised)}</span><span className="sub2">Booked-hours estimate {fmtUSD(r.inv.projected)}</span></div>
            </div>)}
          columns={[
            { key: 'code', label: 'Project ID', value: (r) => r.project.code, render: (r) => <span className="code">{r.project.code}</span> },
            { key: 'name', label: 'Project name', value: (r) => r.project.name, render: (r) => projectStatus(r.project, AS_OF) === 'active' ? r.project.name : <span style={{ color: 'var(--muted)' }}>{r.project.name} <Badge cls="b-neutral">Inactive, {projectStatus(r.project, AS_OF) === 'on_hold' ? 'on hold' : 'completed'}</Badge></span> },
            { key: 'client', label: 'Client name', value: (r) => r.project.client, render: (r) => r.project.client },
            { key: 'sow', label: 'SOW No', value: (r) => r.project.sow, render: (r) => <span className="sub2" style={{ color: 'var(--ink-2)' }}>{r.project.sow}</span> },
            { key: 'month', label: 'Month', render: (r) => monthName(r.month) },
            { key: 'projected', label: 'Projected revenue', align: 'right', render: (r) => fmtUSD(r.projected) },
            { key: 'realised', label: 'Realised inv amt', align: 'right', render: (r) => fmtUSD(r.realised) },
            { key: 'pending', label: 'Pending', align: 'right', render: (r) => r.pending ? fmtUSD(r.pending) : '–' },
            { key: 'status', label: 'Status', value: (r) => Object.keys(REALIZATION).indexOf(r.status), csv: (r) => REALIZATION[r.status].label, render: (r) => <Badge cls={REALIZATION[r.status].cls} icon={REALIZATION[r.status].icon}>{REALIZATION[r.status].label}</Badge> },
          ]} />
      </Panel>
      </>)}
    </>
  );
}

const lastWorkdayPlain = (s) => { let d = s; while (isWeekend(d)) d = addDays(d, -1); return d; };
const PRESETS = [   // the app's presets
  { id: 'today', label: 'Today', range: () => [AS_OF, AS_OF] },
  { id: 'month', label: 'This month', range: () => [startOfMonth(AS_OF), AS_OF] },
  { id: 'last', label: 'Last month', range: () => { const s = startOfMonth(addMonths(AS_OF, -1)); return [s, endOfMonth(s)]; } },
  { id: 'quarter', label: 'This quarter', range: () => [startOfQuarter(AS_OF), AS_OF] },
];
const defaultFilters = () => { const [from, to] = PRESETS[1].range(); return { preset: 'month', from, to, teamId: ALL, projectId: ALL, skill: ALL, query: '', category: ALL, empStatus: 'active' }; };   // This month, as in the app

function FilterBar({ f, setFilter, reset, idx, view, groupBy, onGroupBy, onFy }) {
  const isDefault = JSON.stringify(f) === JSON.stringify(defaultFilters());
  const setDate = (k, v) => {
    if (!v) return;
    const next = { ...f, [k]: minS(maxS(v, DATA_START), AS_OF), preset: 'custom' };
    if (next.from > next.to) [next.from, next.to] = [next.to, next.from];
    setFilter(next);
  };
  const sel = (id, label, value, onChange, options) => <span className="field"><label htmlFor={id}>{label}</label><select id={id} value={value} onChange={(e) => onChange(e.target.value)}>{options.map(([v, t]) => <option key={v} value={v}>{t}</option>)}</select></span>;
  return (
    <div className="filters" role="search">
      <Seg label="Date range" options={PRESETS.map((p) => [p.id, p.label])} value={f.preset} onChange={(id) => { const [from, to] = PRESETS.find((p) => p.id === id).range(); setFilter({ preset: id, from, to }); }} />
      {FY_VIEWS.includes(view) && <span className="field"><label htmlFor="fy">Financial year</label><select id="fy" value={f.preset.startsWith('fy') ? f.preset : ''} onChange={(e) => e.target.value && onFy(e.target.value)}><option value="">Pick a year</option>{FYS.map((x) => <option key={x.id} value={x.id}>{x.label}</option>)}</select></span>}
      <span className="field"><input aria-label="From" type="date" min={DATA_START} max={AS_OF} value={f.from} onChange={(e) => setDate('from', e.target.value)} /></span>
      <span className="dash" aria-hidden="true">→</span>
      <span className="field"><input aria-label="To" type="date" min={DATA_START} max={AS_OF} value={f.to} onChange={(e) => setDate('to', e.target.value)} /></span>
      <span className="vsep" aria-hidden="true" />
      {sel('team', 'Team', f.teamId, (v) => setFilter({ teamId: v }), [[ALL, 'All teams'], ...idx.data.teams.map((t) => [t.id, t.name])])}
      {sel('skill', 'Skill', f.skill, (v) => setFilter({ skill: v }), [[ALL, 'All skills'], ...idx.skills.map((x) => [x, x])])}
      {sel('grp', 'Group by', groupBy, onGroupBy, [['Employee', 'Employee'], ['Project', 'Project'], ['Skill', 'Skill']])}
      {view === 'utilization' && sel('cat', 'Category', f.category, (v) => setFilter({ category: v }), [[ALL, 'All'], ...Object.entries(CATEGORY_LABEL)])}
      {(view === 'utilization' || view === 'bench') && sel('est', 'Employee status', f.empStatus, (v) => setFilter({ empStatus: v }), [['active', 'Active'], ['inactive', 'Inactive'], ['all', 'All']])}
      {!isDefault && <button className="btn ghost" type="button" onClick={reset}><Icon name="reset" size={13} />Reset filters</button>}
    </div>
  );
}

// Tab ids and labels as in the app (REPORT_TAB_LABEL).
const VIEWS = [['utilization', 'Utilization'], ['bench', 'Ready to Deploy'], ['headcount', 'Project Headcount'], ['skill_gap', 'Skill Gap'], ['open_positions', 'Open Positions'], ['|'],
  ['bench_cost', 'Deploy Cost (FY)'], ['intern_investment', 'Intern Investment'], ['mbr', 'MBR'], ['salary_bands', 'Salary Bands'], ['invoice_realization', 'Realized Invoice Value']];
// As in the app, only these four tabs have the shared filter bar; the others carry their own filters.
const SHARED_VIEWS = ['utilization', 'bench', 'headcount', 'skill_gap'];
const PEOPLE_VIEWS = ['utilization', 'bench', 'headcount'];
const FY_VIEWS = ['utilization', 'headcount'];   // tabs that also filter by financial year (1 Apr – 31 Mar)

function App() {
  const [load, setLoad] = useState({ status: 'loading' });
  const [attempt, setAttempt] = useState(0);
  const [view, setView] = useState(() => { const v = new URLSearchParams(location.search).get('view'); return VIEWS.some((x) => x[0] === v && v !== '|') ? v : 'utilization'; });
  const [rawF, setF] = useState(defaultFilters);
  const setFilter = useCallback((patch) => setF((cur) => ({ ...cur, ...patch })), []);
  const [fyId, setFyId] = useState(FYS[0].id);   // one financial year, shared by Deploy Cost, Intern Investment and Realized Invoice Value
  const fyLabel = fyName(FYS.find((x) => x.id === fyId));
  // Picking a financial year sets the range to 1 Apr – 31 Mar, or to today for the current year.
  const pickFy = useCallback((id) => { const y = FYS.find((x) => x.id === id); setFilter({ preset: id, from: y.start, to: minS(y.end, AS_OF) }); }, [setFilter]);
  // Group By is per tab, each starting where its table reads best.
  const [groupBy, setGroupBy] = useState({ utilization: 'Employee', bench: 'Employee', headcount: 'Project', skill_gap: 'Skill' });

  // Simulated fetch. Swap buildDemoDataset() for API calls returning the same shapes.
  useEffect(() => {
    setLoad({ status: 'loading' });
    const mode = new URLSearchParams(location.search).get('demo');
    const t = setTimeout(() => {
      if (mode === 'error' && attempt === 0) setLoad({ status: 'error', message: 'The reports service did not respond in time (simulated failure).' });
      else setLoad({ status: 'ready', idx: buildIndex(buildDemoDataset()) });
    }, mode === 'slow' ? 2500 : 450);
    return () => clearTimeout(t);
  }, [attempt]);

  useEffect(() => { const u = new URL(location.href); u.searchParams.set('view', view); history.replaceState(null, '', u); }, [view]);

  // Like the app: a range with no working day reports on the last working day before it.
  const idx = load.idx;
  const adjusted = idx && workdayCount(idx, rawF.from, rawF.to) === 0;
  const f = useMemo(() => adjusted ? { ...rawF, from: lastWorkdayPlain(rawF.from), to: lastWorkdayPlain(rawF.from) } : rawF, [rawF, adjusted]);
  // Tabs without the shared bar ignore it: they see everyone, and each report counts people from joining to leaving.
  const shared = SHARED_VIEWS.includes(view);
  const fv = useMemo(() => shared ? f : { ...defaultFilters(), from: DATA_START, to: AS_OF }, [shared, f]);
  const people = useMemo(() => {
    if (!idx) return [];
    const base = scopeEmployees(idx, fv);
    if (view !== 'utilization' && view !== 'bench') return base;
    return base.filter((e) => (f.empStatus === 'all' || (f.empStatus === 'inactive') === !!e.left) && (view !== 'utilization' || f.category === ALL || e.category === f.category));
  }, [idx, fv, view, f.empStatus, f.category]);
  const scopeText = [f.teamId !== ALL && idx && idx.teamName.get(f.teamId), f.skill !== ALL && `${f.skill} skill`].filter(Boolean).join(', ') || 'All teams';
  const headPeriod = shared ? (rawF.preset.startsWith('fy') ? fyName(FYS.find((x) => x.id === rawF.preset)) + ', ' : '') + fmtRange(f.from, f.to) + '. ' + scopeText : view === 'salary_bands' ? 'Current snapshot' : view === 'mbr' ? 'Monthly business review'
    : view === 'open_positions' ? 'Positions as of today' : view === 'invoice_realization' ? 'Invoices and collections' : fyLabel;
  const needsPeople = PEOPLE_VIEWS.includes(view);

  return (
    <>
      <header className="topbar">
        <span className="logo" aria-hidden="true">P</span><b>Pulse</b><span className="crumb">Reports</span>
        <span className="demo-flag" title="All figures are synthetic and generated in this file."><i />Demo data</span>
      </header>
      <main className="page">
        <div className="head">
          <h1>Reports</h1>
          <p>{headPeriod}. {idx && needsPeople ? `${people.length} people in view. ` : ''}Figures as of {fmtDate(AS_OF, true)}.</p>
        </div>
        <nav className="tabs" role="tablist" aria-label="Reports">
          {VIEWS.map(([id, label], i) => id === '|' ? <span key={i} className="tab-sep" aria-hidden="true" /> :
            <button key={id} role="tab" type="button" className="tab" aria-selected={view === id} onClick={() => setView(id)}>{label}</button>)}
        </nav>

        {load.status === 'loading' && (
          <div aria-busy="true" aria-label="Loading reports">
            <div className="skel" style={{ height: 34, width: '70%', marginBottom: 16 }} />
            <div className="skel" style={{ height: 104, marginBottom: 16 }} />
            <div className="row main"><div className="skel" style={{ height: 340 }} /><div className="skel" style={{ height: 340 }} /></div>
          </div>
        )}
        {load.status === 'error' && (
          <div className="panel"><div className="state" role="alert">
            <Icon name="alert" size={22} style={{ color: 'var(--red)' }} />
            <h3>Reports could not load</h3>
            <p>{load.message} Your filters are kept. Retry to load the data again.</p>
            <button className="btn" type="button" onClick={() => setAttempt((a) => a + 1)}><Icon name="reset" size={13} />Retry</button>
          </div></div>
        )}
        {load.status === 'ready' && (<>
          {shared && <FilterBar f={rawF} setFilter={setFilter} reset={() => setF(defaultFilters())} idx={idx} view={view} groupBy={groupBy[view]} onGroupBy={(v) => setGroupBy((g) => ({ ...g, [view]: v }))} onFy={pickFy} />}
          {adjusted && shared && <div className="note">No working days in the selected range. Showing <b>{WD[toD(f.from).getUTCDay()]} {fmtDate(f.from, true)}</b>, the last working day.</div>}
          {needsPeople && !people.length && !(view === 'utilization' && f.category === 'intern' && idx.data.interns.length) ? (
            <div className="panel"><div className="state">
              <h3>No one matches these filters</h3>
              <p>{view === 'utilization' && f.category === 'intern' ? 'Interns are not counted in utilization. Intern Investment shows their time and cost.'
                : f.empStatus === 'inactive' ? `Nobody who has left was with the company in ${fmtRange(f.from, f.to)}. Widen the date range or set Employee status to All.`
                : `No one matches this team, skill and category in ${fmtRange(f.from, f.to)}.`}</p>
              <button className="btn" type="button" onClick={() => setF(defaultFilters())}><Icon name="reset" size={13} />Reset filters</button>
            </div></div>
          ) : view === 'utilization' ? <UtilizationView idx={idx} f={f} people={people} groupBy={groupBy.utilization} />
            : view === 'bench' ? <ReadyView idx={idx} f={f} people={people} groupBy={groupBy.bench} />
            : view === 'headcount' ? <HeadcountView idx={idx} f={f} people={people} groupBy={groupBy.headcount} />
            : view === 'skill_gap' ? <SkillGapView idx={idx} f={f} people={people} groupBy={groupBy.skill_gap} />
            : view === 'open_positions' ? <PositionsView idx={idx} f={fv} />
            : view === 'bench_cost' ? <DeployCostView idx={idx} f={fv} people={people} fyId={fyId} setFyId={setFyId} />
            : view === 'intern_investment' ? <InternView idx={idx} f={fv} fyId={fyId} setFyId={setFyId} />
            : view === 'mbr' ? <MBRView idx={idx} f={fv} people={people} />
            : view === 'salary_bands' ? <SalaryView idx={idx} f={fv} people={people} />
            : <InvoiceView idx={idx} f={fv} fyId={fyId} setFyId={setFyId} />}
        </>)}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
