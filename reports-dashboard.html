<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports Prototype</title>
<!--
  Pulse (RMG Utility) Reports dashboard prototype. Single self-contained file.

  Tabs mirror the app's Reports page (frontend/src/pages/Reports.tsx): Utilization, Ready to Deploy,
  Project Headcount, Skill Gap, Open Positions, Deploy Cost (FY), Intern Investment, MBR, Salary Bands
  and Realized Invoice Value. Each report follows the app's
  own definitions (see the METRICS section), restyled as a dashboard.

  DEMO DATA ONLY: every name, client, project, rate and record below is synthetic and generated in
  this file. Nothing is fetched from an API, database or auth service. Open this file in a browser
  (internet needed only for the CDN scripts and fonts).
  URL switches: ?view=<tab id>, ?demo=error (first load fails, Retry recovers), ?demo=slow.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18.3.1/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.15.4/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
/* Tokens from the main app (frontend/src/index.css, DESIGN.md). Green/amber/red mean allocation health only.
   Chart series hues (purple, deep blue, raspberry) were run through a CVD palette validator: all pairs pass,
   the closest pair sits in the 6-8 band, so every chart also carries a legend, 2px gaps and a table view. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#F8F8FD; --border:#E4E5F0; --border-soft:#EEEEF8;
  --ink:#0F1333; --ink-2:#3D4466; --muted:#6B7399;
  --purple:#9C4BE6; --purple-600:#7A2FC4; --purple-tint:#F3EEFF; --purple-200:#E8DCFF;
  --blue:#1F5FAD; --rasp:#CB5496; --neutral-mark:#C3C6D9; --track:#E3E4EF;
  --green:#0D9458; --green-bg:#E6F7EF; --amber:#C47E00; --amber-bg:#FFF3D6; --red:#D13C2C; --red-bg:#FDECEA; --orange:#E8590C; --orange-bg:#FDEDE3;
  --nav:#0B1130;
  --grad:linear-gradient(135deg,#9C4BE6 0%,#CB5496 100%);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.topbar{background:var(--nav);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 24px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:13px}
.topbar b{font-weight:600;letter-spacing:.2px}
.topbar .crumb{color:#A8B8D8;font-size:13px}
.demo-flag{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:12px;color:#fff}
.demo-flag i{width:7px;height:7px;border-radius:50%;background:#F0C96A}

.page{max-width:1440px;margin:0 auto;padding:22px 24px 48px}
.head h1{font:400 30px/1.1 var(--display);margin:0}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}

/* tabs (PageTabs: underline, never filled) */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin:18px 0 14px;overflow-x:auto;align-items:center}
.tab{background:none;border:0;padding:10px 0;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--purple);font-weight:600}
.tab-sep{width:1px;height:18px;background:var(--border);flex:none}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:#ECEDF5;border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,19,51,.12)}
.seg.sm button{padding:3px 9px;font-size:12px}
.field{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 10px;height:34px;font-size:13px}
.field label{color:var(--muted)}
.field input,.field select{border:0;background:none;outline:none;height:32px;font-size:13px;max-width:190px}
.field input[type=search]{width:170px}
.dash{color:var(--muted)}
.vsep{width:1px;height:20px;background:var(--border);margin:0 4px}
tr.grp td{background:#F4F4FA;font-weight:600;font-size:12.5px;color:var(--ink)}
.excl{position:relative;cursor:pointer}
.excl summary{list-style:none;display:flex;align-items:center;gap:6px;height:32px;color:var(--ink)}
.excl summary::-webkit-details-marker{display:none}
.excl-pop{position:absolute;top:38px;left:0;z-index:20;min-width:190px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(15,19,51,.14)}
.excl-pop label{display:flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer}
.chips-row{gap:6px;margin-bottom:8px}

.fchip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:12.5px;cursor:pointer}
.fchip[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-tint);color:var(--purple-600);font-weight:600}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink-2)}

.note b{color:var(--ink)}

/* KPI strip: one band, divided cells */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpis.many{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis.many .kpi{padding:16px 14px 12px}
.kpi::before{content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:3px;border-radius:var(--r) var(--r) 0 0;background:var(--grad)}
.kpi{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,19,51,.05);padding:18px 18px 14px;display:flex;gap:10px;justify-content:space-between;min-width:0}
.kpi .lbl{display:flex;align-items:center;gap:6px}
.kinfo{position:relative;display:inline-flex}
.kinfo-btn{all:unset;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:var(--muted);cursor:help}
.kinfo-btn:hover,.kinfo-btn[aria-expanded="true"]{color:var(--purple-600)}
.kinfo-btn:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
.kinfo-pop{position:absolute;top:calc(100% + 8px);z-index:30;width:min(340px,80vw);display:flex;flex-direction:column;gap:3px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(15,19,51,.14);font-weight:400;text-align:left;cursor:auto}
.kinfo-pop.left{left:-8px}
.kinfo-pop.right{right:-8px}
.kinfo-pop .kt{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
.kinfo-pop .kp{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.kinfo-pop .kh{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.kinfo-pop .kw{color:var(--amber)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-top:4px}
.kpi .val small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .sub{font-size:12px;color:var(--ink-2);margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.kpi .sub .dim{color:var(--muted)}
.kpi .spark{width:96px;height:44px;flex:none;align-self:flex-end}

/* layout */
.row{display:grid;gap:16px;margin-bottom:16px;align-items:start}
.row.main{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);align-items:stretch}
.row.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.panel + .panel{margin-top:0}
.panel-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 6px;flex-wrap:wrap}
.panel-h h2{font-size:15px;font-weight:600;margin:0}
.panel-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted);max-width:72ch}
.panel-h .tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.panel-b{padding:6px 16px 16px;flex:1;min-width:0}
.chart{height:280px}
.chart.short{height:240px}
.row.main .chart{height:330px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);padding:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.line{height:3px;width:14px;border-radius:2px}
.clickable .recharts-bar-rectangle,.clickable .recharts-pie-sector{cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.period-note{font-size:13px;color:var(--ink-2);margin:-2px 0 14px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500}
.trend .tri{font-size:9px;line-height:1}
.trend.bad{color:var(--red)}
.trend.good{color:var(--green)}
.trend.neutral{color:var(--ink-2)}
.skill-bars{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.skill-bars button{all:unset;box-sizing:border-box;display:block;width:100%;padding:7px 6px;border-radius:6px;cursor:pointer}
.skill-bars button:hover{background:var(--surface-2)}
.skill-bars button[aria-pressed="true"]{background:var(--purple-tint)}
.skill-bars button:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
.sb-top{display:flex;align-items:baseline;gap:10px;font-size:13px;margin-bottom:5px}
.sb-name{flex:1;font-weight:500;color:var(--ink)}
.sb-top b{min-width:64px;text-align:right}
.sb-track{display:block;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.sb-track i{display:block;height:100%;border-radius:3px;background:var(--purple)}
.donut{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center;min-height:220px}
.donut-chart{position:relative;height:200px}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-center .num{font-size:26px;font-weight:700;line-height:1.1}
.donut-legend button{grid-template-columns:18px 1fr auto;padding:8px 4px}
@media (max-width:640px){.donut{grid-template-columns:1fr}.donut-chart{max-width:220px;margin:0 auto;width:100%}}

.tip{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(15,19,51,.10);padding:9px 11px;font-size:12.5px;min-width:170px}
.tip .t{font-weight:600;margin-bottom:5px}
.tip .r{display:flex;align-items:center;gap:12px;justify-content:space-between}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .n{color:var(--muted);margin-top:5px;font-size:11.5px;max-width:240px}

/* attention rail */
.att{list-style:none;margin:0;padding:0}
.att li + li{border-top:1px solid var(--border-soft)}
.att button,.att .static{width:100%;text-align:left;background:none;border:0;padding:10px 4px;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;border-radius:6px}
.att button{cursor:pointer}
.att button:hover{background:var(--surface-2)}
.att button[aria-pressed="true"]{background:var(--purple-tint)}

.att .who{font-weight:600;font-size:13px}
.att .why{font-size:12px;color:var(--muted)}
.att .fig{font-weight:600;font-size:13px;white-space:nowrap}
.att-group{font-size:12px;font-weight:600;color:var(--ink-2);margin:10px 0 2px;display:flex;justify-content:space-between}
.att-group:first-child{margin-top:0}
.more{padding:8px 4px;font-size:12px;color:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.b-over,.b-gap{color:var(--red);background:var(--red-bg)}
.b-healthy,.b-covered{color:var(--green);background:var(--green-bg)}
.b-under,.b-partial{color:var(--amber);background:var(--amber-bg)}
.b-orange{color:var(--orange);background:var(--orange-bg)}
.b-neutral{color:var(--ink-2);background:#ECEDF5}
.b-purple{color:var(--purple-600);background:var(--purple-tint)}
.b-rasp{color:#A23E78;background:#FBEAF3}
.b-blue{color:var(--blue);background:#E8F0FA}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--purple-tint);color:var(--purple-600);border:1px solid var(--purple-200);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:600}
.chip button{border:0;background:none;cursor:pointer;color:inherit;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:var(--purple-200)}
.skill{display:inline-block;white-space:nowrap;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:0 6px;margin:1px 4px 1px 0}
.skill.on{border-color:var(--purple);color:var(--purple-600)}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:2px;background:var(--track)}
.dots i.f{background:var(--purple)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}

tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}

.r{text-align:right}
.person{display:flex;align-items:center;gap:8px;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.sub2{font-size:12px;color:var(--muted)}

.meter{display:flex;align-items:center;gap:8px;min-width:150px}
.meter .bar{flex:1;height:6px;background:var(--track);border-radius:3px;position:relative;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.meter .bar i.over{background:var(--red-600,#B02A1D);border-radius:0 3px 3px 0;box-shadow:-2px 0 0 #fff}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 0;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.slots{display:grid;gap:4px}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.slot .n{color:var(--muted)}
.chev{display:inline-block;transition:transform .15s}
.chev.open{transform:rotate(90deg)}

.state{padding:40px 16px;text-align:center;color:var(--ink-2)}
.state h3{margin:8px 0 4px;font-size:15px;color:var(--ink)}
.state p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.skel{background:linear-gradient(90deg,#ECEDF5 0%,#F5F6FB 50%,#ECEDF5 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.chev{transition:none}}

@media (min-width:1101px){
  .kpis.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  .row.main,.row.half{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .page{padding:16px}
  .topbar{padding:10px 16px}
  .kpis{grid-template-columns:1fr}
  .field input[type=search]{width:120px}
  .chart,.row.main .chart{height:240px}
}
</style>

<body>
<div id="root"></div>
<noscript>This prototype needs JavaScript.</noscript>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useCallback } = React;
const {
  ResponsiveContainer, LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,
  ReferenceLine, ReferenceArea, PieChart, Pie, Cell, LabelList, AreaChart, Area, ComposedChart, ScatterChart, Scatter, ZAxis, Treemap,
} = Recharts;

/* =====================================================================================
   1. DEMO DATA (synthetic). Roster, projects, allocations, project skill requirements and
   positions are hand-authored so the story is deliberate: a bank project ends in September
   and pushes people to the bench, a GenAI project ramps up, a few people are overbooked.
   Day-level timesheet entries are generated from the allocations with a seeded PRNG, so
   every load is identical and every number on screen traces back to the same records.
   ===================================================================================== */
const AS_OF = '2026-10-25';          // "today" for every report (a Sunday)
const DATA_START = '2020-03-30';     // first Monday with records: history from FY 2020–21 onwards
const CUR_START = '2026-03-30';      // detailed records for this year start here; earlier years are generated history
const FY_START = '2026-04-01';       // Indian financial year: 1 Apr – 31 Mar
const FY_END = '2027-03-31';
const FY_LABEL = 'FY 2026–27';
const HORIZON = '2027-03-31';
/** The financial year (1 Apr – 31 Mar) a date falls in. */
const fyOf = (d) => {
  const y = +d.slice(0, 4) - (+d.slice(5, 7) < 4 ? 1 : 0);
  return { id: 'fy' + String(y).slice(2) + String(y + 1).slice(2), label: `FY ${y}–${String(y + 1).slice(2)}`, start: y + '-04-01', end: (y + 1) + '-03-31' };
};
// Every financial year the demo covers, newest first.
const FYS = [];
for (let y = +fyOf(AS_OF).start.slice(0, 4); y >= 2020; y--) { const fy = fyOf(y + '-04-01'); FYS.push(fy.end >= AS_OF ? { ...fy, label: fy.label + ' (Current)' } : fy); }
const fyName = (fy) => fy.label.replace(' (Current)', '');
const HOLIDAYS = ['2026-09-14', '2026-10-02', ...[2020, 2021, 2022, 2023, 2024, 2025].flatMap((y) => [y + '-01-26', y + '-08-15', y + '-10-02'])];
const HOURS_PER_DAY = 8;
const TARGET = 80;                   // utilization target line (demo assumption)
const RTD_DEFAULT = 50;              // app default: Ready to Deploy = at or below 50% booked

const TEAMS = [
  { id: 'de', name: 'Data Engineering' }, { id: 'bi', name: 'Analytics & BI' }, { id: 'app', name: 'Application Dev' },
  { id: 'ai', name: 'AI & ML' }, { id: 'qa', name: 'Quality Engineering' }, { id: 'cloud', name: 'Cloud & DevOps' },
];

/* ----- date helpers (UTC, ISO strings) ----- */
const DAY = 86400000;
const toD = (s) => new Date(s + 'T00:00:00Z');
const toS = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => toS(new Date(toD(s).getTime() + n * DAY));
const diffDays = (a, b) => Math.round((toD(b) - toD(a)) / DAY);
const isWeekend = (s) => { const d = toD(s).getUTCDay(); return d === 0 || d === 6; };
const mondayOf = (s) => { const d = toD(s).getUTCDay(); return addDays(s, d === 0 ? -6 : 1 - d); };
const startOfMonth = (s) => s.slice(0, 7) + '-01';
const endOfMonth = (s) => { const d = toD(startOfMonth(s)); d.setUTCMonth(d.getUTCMonth() + 1); return addDays(toS(d), -1); };
const addMonths = (s, n) => { const d = toD(s); const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); const last = toD(endOfMonth(toS(d))).getUTCDate(); d.setUTCDate(Math.min(day, last)); return toS(d); };
const startOfQuarter = (s) => { const m = +s.slice(5, 7); return `${s.slice(0, 4)}-${String(m - ((m - 1) % 3)).padStart(2, '0')}-01`; };
const minS = (a, b) => (a < b ? a : b);
const maxS = (a, b) => (a > b ? a : b);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDate = (s, y) => { const d = toD(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}${y ? ' ' + d.getUTCFullYear() : ''}`; };
const fmtMonth = (s) => { const d = toD(s); return `${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
/** Length of time between two dates, as "6 yrs 4 mo". */
const fmtSpan = (a, b) => {
  const m = (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)) - (+b.slice(8) < +a.slice(8) ? 1 : 0);
  const y = Math.floor(m / 12), r = m % 12;
  return m < 1 ? 'under a month' : [y && y + (y === 1 ? ' yr' : ' yrs'), r && r + ' mo'].filter(Boolean).join(' ');
};
const fmtRange = (a, b) => a === b ? fmtDate(a, true) : `${fmtDate(a, a.slice(0, 4) !== b.slice(0, 4))} – ${fmtDate(b, true)}`;

const nf = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const fmtN = (n) => nf.format(Math.round(n));
const fmtPct = (n) => (n == null ? '–' : `${Math.round(n)}%`);
const fmtH = (n) => `${fmtN(n)} h`;
const fmtUSD = (n) => '$' + Math.round(n).toLocaleString('en-US');
const fmtUSDShort = (n) => n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? '$' + (n / 1e3).toFixed(1) + 'K' : '$' + Math.round(n);
const fmtINR = (n) => n >= 1e7 ? `₹${(n / 1e7).toFixed(2)} Cr` : n >= 1e5 ? `₹${(n / 1e5).toFixed(1)} L` : `₹${fmtN(n)}`;

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const half = (n) => Math.round(n * 2) / 2;

function pickStatus(r, week, late) {
  const weeksAgo = Math.floor(diffDays(week, AS_OF) / 7);
  if (weeksAgo === 0) return r < 0.4 ? 'submitted' : 'not_submitted';          // current week, not due yet
  if (weeksAgo === 1) { if (r < (late ? 0.35 : 0.03)) return 'not_submitted'; if (r < 0.5) return 'approved'; return r < 0.95 ? 'submitted' : 'rejected'; }
  if (weeksAgo === 2) { if (late && r < 0.25) return 'not_submitted'; if (r < 0.82) return 'approved'; return r < 0.95 ? 'submitted' : 'rejected'; }
  if (late && r < 0.08) return 'not_submitted';
  return r < 0.995 ? 'approved' : 'not_submitted';
}

/** Builds the whole demo dataset. Shaped like API payloads, so fetches could replace it. */
function buildDemoDataset() {
  const rand = mulberry32(20261025);
  const rh = mulberry32(20200401);   // history and the long-tenure people draw from their own stream, so this year's figures are unchanged
  const projectById = new Map(PROJECTS.map((p) => [p.id, p]));
  const holidays = new Set(HOLIDAYS);
  const employees = [];
  const allocations = [];
  [...PEOPLE, ...LONG_TENURE, ...LEAVERS].forEach(([name, teamId, role, grade, skills, allocs], i) => {
    const id = 'e' + String(i + 1).padStart(2, '0');
    const R = i < PEOPLE.length ? rand : rh;
    const hourlyCost = MISSING_COST.has(name) ? null : Math.round(RATE[grade] * (0.88 + R() * 0.26) * 10) / 10;
    const expYears = Math.round((EXP_RANGE[grade][0] + R() * (EXP_RANGE[grade][1] - EXP_RANGE[grade][0])) * 10) / 10;
    const t = TENURE[grade];
    const joined = JOINED[name] || mondayOf(addDays(AS_OF, -Math.round(Math.max(0.7, Math.min(expYears, t[0] + rh() * (t[1] - t[0]))) * 365)));
    employees.push({
      id, name, teamId, role, grade, code: 'KAN-' + (1001 + i), type: CONTRACTORS.has(name) ? 'Contract' : 'FTE',
      hourlyCost, expYears, joined, left: LEFT[name] || null, category: CATEGORY[name] || (['Lead', 'Manager'].includes(grade) ? 'supervisory' : 'delivery'), missingPriorExp: MISSING_PRIOR_EXP.has(name), fresh: i >= PEOPLE.length,
      initials: name.split(' ').map((p) => p[0]).join('').slice(0, 2),
      skills: skills.split(',').map((s) => { const [skill, level] = s.split(':'); return { skill, level: +level }; }),
    });
    const current = allocs.map(([pid, percent, start, end], j) => {
      const p = projectById.get(pid);
      return { id: `${id}-a${j}`, employeeId: id, projectId: pid, percent,
        start: maxS(start || p.start, maxS(p.start, joined)), end: minS(minS(end || p.end || HORIZON, p.end || HORIZON), LEFT[name] || '9999-12-31') };
    });
    allocations.push(...current);
    // History: stints on the team's past projects from joining until this year's bookings, with some time between.
    const histEnd = addDays(minS(minS(CUR_START, current.reduce((m, a) => minS(m, a.start), CUR_START)), LEFT[name] ? addDays(LEFT[name], 1) : CUR_START), -1);
    let at = maxS(joined, DATA_START), n = 0;
    while (at <= histEnd) {
      const pool = HISTORY_POOL[teamId].map((x) => projectById.get(x)).filter((x) => x.start <= at && (!x.end || x.end > addDays(at, 45)));
      if (!pool.length) { at = addDays(at, 28); continue; }   // nothing to staff yet: undeployed
      const proj = pool[Math.floor(rh() * pool.length)];
      const end = minS(minS(addDays(at, 120 + Math.floor(rh() * 330)), proj.end || histEnd), histEnd);
      allocations.push({ id: `${id}-h${n++}`, employeeId: id, projectId: proj.id, percent: rh() < 0.2 ? 50 : 100, start: at, end });
      at = addDays(end, 1 + (rh() < 0.5 ? 0 : 7 + Math.floor(rh() * 50)));
    }
  });
  const empByName = new Map(employees.map((e) => [e.name, e]));

  const entries = [];
  for (const emp of employees) {
    const mine = allocations.filter((a) => a.employeeId === emp.id);
    const late = LATE_SUBMITTERS.has(emp.name);
    for (let week = DATA_START; week <= AS_OF; week = addDays(week, 7)) {
      if (week < mondayOf(emp.joined) || (emp.left && week > emp.left)) continue;   // not with the company that week
      const R = emp.fresh || week < CUR_START ? rh : rand;
      const status = pickStatus(R(), week, late);
      const weekAllocs = mine.filter((a) => a.start <= addDays(week, 6) && a.end >= week).sort((a, b) => b.percent - a.percent);
      const sheet = { id: `${emp.id}-${week}`, employeeId: emp.id, weekStart: week, status, submittedOn: null,
        approver: weekAllocs[0] ? projectById.get(weekAllocs[0].projectId).pm : 'Siddharth Menon',
        totalHours: 0, billableHours: 0, nonBillableHours: 0, leaveHours: 0 };
      // An unsubmitted timesheet carries no hours: nothing has reached the report yet.
      if (status !== 'not_submitted') {
        const weeksAgo = Math.floor(diffDays(week, AS_OF) / 7);
        sheet.submittedOn = weeksAgo === 0 ? addDays(week, 4 + Math.floor(R() * 2)) : minS(addDays(week, 7 + Math.floor(R() * (late ? 6 : 3))), AS_OF);
        for (let d = 0; d < 5; d++) {
          const date = addDays(week, d);
          if (isWeekend(date) || holidays.has(date)) continue;
          const add = (projectId, kind, hours) => {
            if (hours <= 0) return;
            entries.push({ employeeId: emp.id, date, projectId, kind, hours });
            sheet.totalHours += hours;
            if (kind === 'billable') sheet.billableHours += hours; else if (kind === 'non_billable') sheet.nonBillableHours += hours; else sheet.leaveHours += hours;
          };
          if (PLANNED_LEAVE[emp.name] === week || R() < 0.035) { add(null, 'leave', 8); continue; }
          const active = mine.filter((a) => a.start <= date && a.end >= date);
          const booked = active.reduce((s, a) => s + a.percent, 0);
          const squeeze = booked > 137 ? 137 / booked : 1;   // nobody logs much past ~11 h a day
          for (const a of active) {
            const p = projectById.get(a.projectId);
            add(a.projectId, p.billable ? 'billable' : 'non_billable', half((a.percent / 100) * 8 * squeeze * (0.9 + R() * 0.18)));
          }
          if (booked < 100) add(null, 'non_billable', half(((100 - booked) / 100) * 8 * (0.45 + R() * 0.35)));
        }
      }
    }
  }
  const positions = POSITIONS.map((p, i) => ({
    ...p, id: 'pos' + i, headcount: p.slots.length,
    slots: p.slots.map((s) => !s ? null : s[0] === 'internal'
      ? { type: 'internal', employeeId: empByName.get(s[1]).id, name: s[1], state: s[2] }
      : { type: 'hire', jobCode: s[1], state: s[2] }),
  }));
  // Invoices: one per client project per month. Projected revenue = booked hours that month x the project's bill rate.
  // Months that have ended are invoiced 3 days after month end with 30-day terms; the current month is not invoiced yet, and some of last month's invoices are still drafts.
  const workdaysIn = (from, to) => { let n = 0; for (let d = from; d <= to; d = addDays(d, 1)) if (!isWeekend(d) && !holidays.has(d)) n++; return n; };
  const projectsOut = PROJECTS.map((p, pi) => {
    const c = COMMERCIALS[p.id];
    return { ...p, code: 'PRJ-' + (101 + pi), bu: c ? c[0] : null, billRate: c ? c[1] : null, sow: c ? c[2] : null };
  });
  const invoices = [];
  for (const proj of projectsOut.filter((x) => x.billRate)) {
    for (let m = FYS[FYS.length - 1].start; m <= AS_OF; m = addDays(endOfMonth(m), 1)) {
      const R = m < FY_START ? rh : rand;
      const mEnd = endOfMonth(m);
      let hours = 0;
      for (const a of allocations) {
        if (a.projectId !== proj.id) continue;
        const s0 = maxS(a.start, m), e0 = minS(a.end, mEnd);
        if (s0 <= e0) hours += (a.percent / 100) * 8 * workdaysIn(s0, e0);
      }
      if (!hours) continue;
      const projected = Math.round((hours * proj.billRate) / 10) * 10;
      const inv = { id: proj.id + '-' + m.slice(0, 7), projectId: proj.id, month: m.slice(0, 7), projected,
        number: 'INV-' + proj.code.slice(4) + '-' + m.slice(0, 7).replace('-', ''), date: null, due: null, invoiced: 0, paid: 0, status: 'not_invoiced' };
      if (mEnd < AS_OF) {
        inv.date = addDays(mEnd, 3); inv.due = addDays(inv.date, 30);
        inv.invoiced = Math.round((projected * (0.94 + R() * 0.06)) / 10) * 10;
        const r = R();
        const daysPastDue = diffDays(inv.due, AS_OF);
        if (daysPastDue > 150) inv.paid = inv.invoiced;   // older invoices have long been settled
        else if (daysPastDue > 25) inv.paid = r < 0.9 ? inv.invoiced : Math.round((inv.invoiced * (0.55 + R() * 0.3)) / 10) * 10;
        else if (daysPastDue > 0) inv.paid = r < 0.5 ? inv.invoiced : r < 0.72 ? Math.round((inv.invoiced * 0.6) / 10) * 10 : 0;
        else inv.paid = r < 0.15 ? inv.invoiced : 0;
        inv.status = inv.paid >= inv.invoiced ? 'paid' : inv.paid > 0 ? 'partial' : daysPastDue > 0 ? 'overdue' : 'sent';
        if (inv.status === 'sent' && diffDays(mEnd, AS_OF) < 31 && rh() < 0.4) { inv.status = 'draft'; inv.date = null; inv.due = null; }
      }
      invoices.push(inv);
    }
  }
  const interns = INTERNS.map(([name, teamId, skill, joined, status, end, bookedPct, stipend], i) => ({
    id: 'i' + String(i + 1).padStart(2, '0'), name, teamId, skill, joined, status, end, bookedPct, stipend,
    initials: name.split(' ').map((x) => x[0]).join('').slice(0, 2), code: 'KAN-I' + (201 + i),
  }));
  const projectSkills = PROJECT_SKILLS.map(([projectId, skill, positions, minLevel]) => ({ projectId, skill, positions, minLevel }));
  return { isDemo: true, asOf: AS_OF, dataStart: DATA_START, teams: TEAMS, projects: projectsOut, employees, allocations, entries, positions, projectSkills, interns, invoices, businessUnits: BUSINESS_UNITS };
}

/* =====================================================================================
   2. METRICS. Pure functions over one dataset + one filter set, following the app's own
   report definitions. KPIs, charts and tables all call these, so their totals agree.

const ALL = 'all';
const healthOf = (pct) => (pct > 100 ? 'over' : pct >= 50 ? 'healthy' : 'under');   // app StatusChip bands
const HEALTH = {
  over: { label: 'Over-allocated', cls: 'b-over', color: 'var(--red)', icon: 'up' },
  healthy: { label: 'Healthy', cls: 'b-healthy', color: 'var(--green)', icon: 'check' },

};
// Open position statuses and filters as in the app (OpenPositionStatusBadge, OpenPositionsReport).
const POS_STATUS = {
  submitted: { label: 'Submitted', cls: 'b-purple' }, in_review: { label: 'In Review', cls: 'b-blue' }, approved: { label: 'Approved', cls: 'b-purple' },
  on_hold: { label: 'On Hold', cls: 'b-neutral' }, fulfilled: { label: 'Fulfilled', cls: 'b-neutral', icon: 'check' }, closed: { label: 'Closed', cls: 'b-neutral' },
};

const PRIORITY_ORDER = ['critical', 'high', 'medium', 'low'];
const SLOT = {
  filled: { label: 'Filled internally', color: '#9C4BE6' },

};

};

function lowerBound(arr, key) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < key) lo = m + 1; else hi = m; } return lo; }

function buildIndex(data) {
  // Working days are Monday to Friday, as in the app (utilization_service, fy_utils): holidays are not taken off capacity.
  const workdays = [];
  for (let d = data.dataStart; d <= addDays(data.asOf, 180); d = addDays(d, 1)) if (!isWeekend(d)) workdays.push(d);
  const dayIndex = new Map(workdays.map((d, i) => [d, i]));
  const dailyPct = new Map(data.employees.map((e) => [e.id, new Float64Array(workdays.length)]));
  for (const a of data.allocations) {
    const row = dailyPct.get(a.employeeId);
    for (let i = lowerBound(workdays, a.start); i < workdays.length && workdays[i] <= a.end; i++) row[i] += a.percent;
  }
  const group = (xs) => { const m = new Map(); for (const x of xs) (m.get(x.employeeId) || m.set(x.employeeId, []).get(x.employeeId)).push(x); return m; };
  return {
    data, workdays, dayIndex, dailyPct,
    employeeById: new Map(data.employees.map((e) => [e.id, e])),
    projectById: new Map(data.projects.map((p) => [p.id, p])),
    teamName: new Map(data.teams.map((t) => [t.id, t.name])),
    entriesBy: group(data.entries), allocsBy: group(data.allocations),
    skills: [...new Set(data.employees.flatMap((e) => e.skills.map((s) => s.skill)).concat(data.projectSkills.map((s) => s.skill)))].sort(),
    lastDue: addDays(mondayOf(data.asOf), -1), // timesheets are due the Monday after the week ends
  };
}
const dayRange = (idx, from, to) => [lowerBound(idx.workdays, from), lowerBound(idx.workdays, addDays(to, 1))];
const workdayCount = (idx, from, to) => { const [i, j] = dayRange(idx, from, to); return Math.max(0, j - i); };
function allocatedHours(idx, id, from, to) { const r = idx.dailyPct.get(id); const [i, j] = dayRange(idx, from, to); let s = 0; for (let k = i; k < j; k++) s += r[k]; return (s / 100) * HOURS_PER_DAY; }
function idleHours(idx, id, from, to) { const r = idx.dailyPct.get(id); const [i, j] = dayRange(idx, from, to); let s = 0; for (let k = i; k < j; k++) s += Math.max(0, 100 - r[k]); return (s / 100) * HOURS_PER_DAY; }
const overlaps = (s, e, from, to) => s <= to && e >= from;
function lastWorkday(idx, date) { const i = lowerBound(idx.workdays, addDays(date, 1)) - 1; return i >= 0 ? idx.workdays[i] : null; }
const pctOn = (idx, id, date) => { const i = idx.dayIndex.get(date); return i === undefined ? 0 : idx.dailyPct.get(id)[i]; };
/** Project status as the app stores it: active, on hold, or completed once its end date has passed. */
const projectStatus = (p, date) => p.onHold ? 'on_hold' : p.end && p.end < date ? 'completed' : 'active';
const hasSkill = (e, skill) => e.skills.some((s) => s.skill === skill);

/** People the filters cover. A project filter keeps people booked on it during the range; a skill filter keeps people who have it. */
function scopeEmployees(idx, f) {
  const q = f.query.trim().toLowerCase();
  const onProject = f.projectId === ALL ? null : new Set(idx.data.allocations.filter((a) => a.projectId === f.projectId && overlaps(a.start, a.end, f.from, f.to)).map((a) => a.employeeId));
  return idx.data.employees.filter((e) => e.joined <= f.to && (!e.left || e.left >= f.from) && (f.teamId === ALL || e.teamId === f.teamId) && (!onProject || onProject.has(e.id)) &&
    (f.skill === ALL || hasSkill(e, f.skill)) &&
    (!q || e.name.toLowerCase().includes(q) || e.role.toLowerCase().includes(q) || e.skills.some((s) => s.skill.toLowerCase().includes(q))));
}

function previousWindow(idx, from, to) {
  const len = diffDays(from, to) + 1;
  const prevFrom = addDays(from, -len);
  return prevFrom < idx.data.dataStart ? null : { from: prevFrom, to: addDays(from, -1) };
}

function buckets(from, to, grain) {
  const out = [];
  let c = grain === 'week' ? mondayOf(from) : startOfMonth(from);
  while (c <= to) {
    const end = grain === 'week' ? addDays(c, 6) : endOfMonth(c);
    out.push({ key: c, label: grain === 'week' ? fmtDate(maxS(c, from)) : fmtMonth(c), start: maxS(c, from), end: minS(end, to) });
    c = addDays(end, 1);
  }
  return out;
}

function sumEntries(idx, id, from, to, pred) { let s = 0; for (const e of idx.entriesBy.get(id) || []) if (e.date >= from && e.date <= to && pred(e)) s += e.hours; return s; }
function currentProjects(idx, id, date) {
  return (idx.allocsBy.get(id) || []).filter((a) => a.start <= date && a.end >= date)
    .map((a) => ({ project: idx.projectById.get(a.projectId), percent: a.percent, end: a.end })).sort((a, b) => b.percent - a.percent);
}

/* ----- Utilization: hours-weighted, allocated hours over capacity hours ----- */
// The app's capacity modes (utilization_service): FULL counts against capacity, ALLOCATED_ONLY against the person's
// own booked hours (always 100%), EXCLUDED is not counted. Defaults: Support and FLIP excluded, interns allocated-only.
const modeOf = (category) => (category === 'support' || category === 'flip' ? 'excluded' : category === 'intern' ? 'allocated_only' : 'full');

function employeeUtilization(idx, f, people) {
  const loggedTo = minS(f.to, idx.lastDue);
  return people.map((e) => {
    const from = maxS(f.from, e.joined);   // capacity runs from joining to leaving
    const to = e.left ? minS(f.to, e.left) : f.to;
    const lt = minS(to, loggedTo);
    const days = workdayCount(idx, from, to);
    const loggedDays = from <= lt ? workdayCount(idx, from, lt) : 0;
    const allocated = allocatedHours(idx, e.id, from, to);
    const cap = days * HOURS_PER_DAY;
    const billable = loggedDays ? sumEntries(idx, e.id, from, lt, (x) => x.kind === 'billable') : 0;
    const raw = cap ? (allocated / cap) * 100 : 0;
    const utilization = Math.min(Math.round(raw * 10) / 10, 999.9);   // shown to 1 decimal, capped, as the app does
    return { id: e.id, employee: e, team: idx.teamName.get(e.teamId), capacityHours: cap, allocatedHours: allocated, utilization, raw, mode: modeOf(e.category),
      billableHours: billable, loggedCapacityHours: loggedDays * HOURS_PER_DAY,
      billableUtil: loggedDays ? (billable / (loggedDays * HOURS_PER_DAY)) * 100 : null,
      health: healthOf(raw), current: currentProjects(idx, e.id, minS(f.to, idx.data.asOf)) };   // bands use the unrounded load
  });
}

/** Interns as utilization rows: booked at their usual share, counted against their own hours (allocated-only). */
function internUtilRows(idx, f, empStatus) {
  return idx.data.interns.filter((it) => it.status !== 'converted' && (empStatus === 'all' || (empStatus === 'inactive') === (it.status === 'exited')) &&
    (f.teamId === ALL || it.teamId === f.teamId) && (f.skill === ALL || it.skill === f.skill)).map((it) => {
    const from = maxS(f.from, it.joined), to = minS(f.to, it.end || '9999-12-31');
    const days = from <= to ? workdayCount(idx, from, to) : 0;
    if (!days) return null;
    const cap = days * HOURS_PER_DAY;
    const e = { id: it.id, name: it.name, initials: it.initials, role: 'Intern', teamId: it.teamId, category: 'intern', skills: [{ skill: it.skill, level: 2 }] };
    return { id: it.id, employee: e, team: idx.teamName.get(it.teamId), capacityHours: cap, allocatedHours: (cap * it.bookedPct) / 100, utilization: it.bookedPct, raw: it.bookedPct,
      mode: 'allocated_only', billableHours: 0, loggedCapacityHours: 0, billableUtil: null, health: healthOf(it.bookedPct), current: [] };
  }).filter(Boolean);
}

function summarizeUtil(rows) {
  // App KPI: allocated hours over paid capacity, counted people only. Full mode pays capacity; allocated-only pays its own hours.
  const counted = rows.filter((r) => r.mode !== 'excluded');
  const cap = counted.reduce((s, r) => s + (r.mode === 'allocated_only' ? r.allocatedHours : r.capacityHours), 0);
  const alloc = counted.reduce((s, r) => s + r.allocatedHours, 0);
  const lcap = rows.reduce((s, r) => s + r.loggedCapacityHours, 0);
  const bill = rows.reduce((s, r) => s + r.billableHours, 0);
  return {
    people: rows.length, counted: counted.length, excluded: rows.filter((r) => r.mode === 'excluded'),
    utilization: cap ? Math.round((alloc / cap) * 1000) / 10 : null,          // hours-weighted, not a mean of percentages
    billableUtil: lcap ? (bill / lcap) * 100 : null,
    peak: rows.reduce((m, r) => (!m || r.utilization > m.utilization ? r : m), null),
    over: rows.filter((r) => r.health === 'over').sort((a, b) => b.utilization - a.utilization),
    under: rows.filter((r) => r.health === 'under').sort((a, b) => a.utilization - b.utilization),
  };
}

function utilizationTrend(idx, f, people, grain, threshold = RTD_DEFAULT) {
  return buckets(f.from, f.to, grain).map((b) => {
    const loggedTo = minS(b.end, idx.lastDue);
    let cap = 0, alloc = 0, ready = 0, over = 0, lcap = 0, bill = 0;
    for (const e of people) {
      const from = maxS(b.start, e.joined);   // only people on the books in this period
      const to = e.left ? minS(b.end, e.left) : b.end;
      const days = workdayCount(idx, from, to);
      if (!days) continue;
      const h = allocatedHours(idx, e.id, from, to);
      cap += days * HOURS_PER_DAY; alloc += h;
      const p = Math.round((h / (days * HOURS_PER_DAY)) * 100); if (p <= threshold) ready++; if (p > 100) over++;
      const lt = minS(to, loggedTo);
      if (from <= lt) { lcap += workdayCount(idx, from, lt) * HOURS_PER_DAY; bill += sumEntries(idx, e.id, from, lt, (x) => x.kind === 'billable'); }
    }
    const billable = lcap ? (bill / lcap) * 100 : null;
    return { ...b, allocated: cap ? (alloc / cap) * 100 : null, billable, ready, over, partial: b.end > idx.lastDue };
  });
}

function teamHealth(idx, rows) {
  return idx.data.teams.map((t) => {
    const m = rows.filter((r) => r.employee.teamId === t.id);
    return { teamId: t.id, team: t.name, over: m.filter((r) => r.health === 'over').length, healthy: m.filter((r) => r.health === 'healthy').length, under: m.filter((r) => r.health === 'under').length, total: m.length };
  }).filter((r) => r.total);
}

/* ----- Ready to Deploy: booked at or below the threshold on the report date ----- */
function readyToDeploy(idx, f, people, positions, threshold) {
  const at = lastWorkday(idx, minS(f.to, idx.data.asOf));
  if (!at) return [];
  const ai = idx.dayIndex.get(at);
  const open = positions.filter((p) => !['fulfilled', 'closed'].includes(p.status));
  return people.filter((e) => (e.category === 'delivery' || e.category === 'supervisory') && e.joined <= at && (!e.left || e.left >= at) && idx.dailyPct.get(e.id)[ai] <= threshold).map((e) => {
    const row = idx.dailyPct.get(e.id);
    const k0 = lowerBound(idx.workdays, e.joined);
    let k = ai; while (k > k0 && row[k - 1] <= threshold) k--;
    const since = k === 0 ? null : idx.workdays[k];
    const cur = currentProjects(idx, e.id, at);
    // Available from (app): the day after the latest end date of the bookings covering the day; the next day if none.
    const lastEnd = cur.reduce((m, c) => maxS(m, c.end), '');
    const availableFrom = addDays(lastEnd || at, 1);
    const idle = idleHours(idx, e.id, f.from, f.to);
    return { id: e.id, employee: e, team: idx.teamName.get(e.teamId), currentPct: row[ai], current: cur, since, onBenchDays: diffDays(since || idx.data.dataStart, at) + 1,
      availableFrom, idleHours: idle, idleCost: idle * (e.hourlyCost || 0), skills: [...e.skills].sort((a, b) => b.level - a.level),
      matches: open.filter((p) => e.skills.some((s) => s.skill === p.skills[0] && s.level >= p.minLevel)) };
  });
}

function upcomingRollOffs(idx, people, threshold, days = 42) {
  const ids = new Set(people.map((p) => p.id));
  const horizon = addDays(idx.data.asOf, days);
  return idx.data.allocations.filter((a) => ids.has(a.employeeId) && a.end > idx.data.asOf && a.end <= horizon).map((a) => {
    const next = lastWorkday(idx, addDays(a.end, 3));
    return { employee: idx.employeeById.get(a.employeeId), project: idx.projectById.get(a.projectId), endsOn: a.end, remaining: next > a.end ? pctOn(idx, a.employeeId, next) : 0 };
  }).filter((r) => r.remaining <= threshold).sort((a, b) => a.endsOn.localeCompare(b.endsOn));
}

/* ----- Project Headcount: unique people booked on each project in the range ----- */
function projectHeadcount(idx, f, people) {
  const ids = new Set(people.map((p) => p.id));
  const asOf = minS(f.to, idx.data.asOf);
  return idx.data.projects.filter((p) => f.projectId === ALL || p.id === f.projectId).map((p) => {
    const allocs = idx.data.allocations.filter((a) => a.projectId === p.id && ids.has(a.employeeId) && overlaps(a.start, a.end, f.from, f.to));
    const members = new Map();
    for (const a of allocs) {
      const m = members.get(a.employeeId) || { employee: idx.employeeById.get(a.employeeId), percent: 0, end: a.end };
      m.percent = Math.max(m.percent, a.percent); m.end = maxS(m.end, a.end);
      members.set(a.employeeId, m);
    }
    const billableRole = (e) => idx.teamName.get(e.teamId);
    return { id: p.id, project: p, status: projectStatus(p, asOf), headcount: members.size, onBillable: p.billable ? members.size : 0,
      members: [...members.values()].sort((a, b) => b.percent - a.percent).map((m) => ({ ...m, team: billableRole(m.employee) })),
      daysLeft: p.end ? diffDays(asOf, p.end) : null };   // counted from the end of the range, so past years read as they did then
  });
}

function headcountTrend(idx, f, people) {
  const ids = new Set(people.map((p) => p.id));
  return buckets(f.from, f.to, 'week').map((b) => {
    const bill = new Set(), internal = new Set();
    for (const a of idx.data.allocations) {
      if (!ids.has(a.employeeId) || !overlaps(a.start, a.end, b.start, b.end)) continue;
      if (f.projectId !== ALL && a.projectId !== f.projectId) continue;
      (idx.projectById.get(a.projectId).billable ? bill : internal).add(a.employeeId);
    }
    return { ...b, billable: bill.size, internal: internal.size };
  });
}

/* ----- Skill Gap: active-project skill requirements vs active employees at the minimum level ----- */
function skillGap(idx, f) {
  const at = minS(f.to, idx.data.asOf);
  const demand = new Map();
  for (const ps of idx.data.projectSkills) {
    const p = idx.projectById.get(ps.projectId);
    if (projectStatus(p, at) !== 'active') continue;
    if (f.projectId !== ALL && p.id !== f.projectId) continue;
    if (f.skill !== ALL && ps.skill !== f.skill) continue;
    const d = demand.get(ps.skill) || { positions: 0, minLevel: 1, projects: [] };
    d.positions += ps.positions; d.minLevel = Math.max(d.minLevel, ps.minLevel); d.projects.push({ name: p.name, positions: ps.positions, minLevel: ps.minLevel });
    demand.set(ps.skill, d);
  }
  const pool = idx.data.employees.filter((e) => (!e.left || e.left > AS_OF) && e.category !== 'support');   // active, allocatable staff   // supply is today's whole organisation, as in the backend
  return [...demand.entries()].map(([skill, d]) => {
    const qualified = pool.filter((e) => e.skills.some((s) => s.skill === skill && s.level >= d.minLevel));
    const supply = qualified.length;
    const status = supply >= d.positions ? 'covered' : supply === 0 ? 'gap' : 'partial';
    return { id: skill, skill, demand: d.positions, supply, gap: Math.max(0, d.positions - supply), minLevel: d.minLevel,
      coverage: Math.min(100, Math.round((supply / d.positions) * 1000) / 10), status, projects: d.projects,
      qualified,
      nearMiss: pool.filter((e) => e.skills.some((s) => s.skill === skill && s.level === d.minLevel - 1)) };
  }).sort((a, b) => b.gap - a.gap || b.demand - a.demand);
}

/* ----- Open Positions ----- */
const slotKind = (s) => !s ? 'unassigned' : s.type === 'hire' ? (s.state === 'confirmed' ? 'filled' : 'hire') : s.state === 'confirmed' ? 'filled' : 'proposed';
/** 'red' when needed-by has passed, 'amber' within 3 days (app isOverdue). Done positions are never overdue. */
const overdueOf = (p, asOf) => {
  if (['fulfilled', 'closed'].includes(p.status)) return null;
  const d = diffDays(asOf, p.neededBy);
  return d <= 0 ? 'red' : d <= 3 ? 'amber' : null;
};
function scopedPositions(idx, f) {
  const q = f.query.trim().toLowerCase();
  return idx.data.positions.filter((p) => (f.teamId === ALL || p.teamId === f.teamId) && (f.projectId === ALL || p.projectId === f.projectId) &&
    (f.skill === ALL || p.skills.includes(f.skill)) &&
    (!q || p.code.toLowerCase().includes(q) || p.role.toLowerCase().includes(q) || p.skills.some((s) => s.toLowerCase().includes(q)) ||
      p.slots.some((s) => s && s.name && s.name.toLowerCase().includes(q))));
}

/* ----- FY reports: shared ----- */
/** Calendar months of the FY up to the as-of date, each clipped to what has happened so far. */
function fyMonths(fy = FYS[0]) {
  const out = [];
  for (let m = fy.start; m <= minS(fy.end, AS_OF); m = addDays(endOfMonth(m), 1)) out.push({ key: m.slice(0, 7), label: MON[+m.slice(5, 7) - 1], start: m, end: minS(endOfMonth(m), AS_OF) });
  return out;
}
const monthName = (key) => fmtMonth(key + '-01');

/* ----- Deploy Cost (FY): working days with no allocation at all, at hourly cost x 8 h (app bench_service) ----- */
// App AGING_BUCKETS, by undeployed working days. Coloured by severity, as in the app: the longer someone sits
// unallocated, the more urgent. Each band also carries a word, so colour is never the only signal.
const DEPLOY_BUCKETS = [
  { key: 'lt2w', label: '< 2 weeks', severity: 'Low', lo: 0, hi: 9, color: '#0D9458' },
  { key: '2to4w', label: '2–4 weeks', severity: 'Watch', lo: 10, hi: 19, color: '#C47E00' },
  { key: '1to2m', label: '1–2 months', severity: 'High', lo: 20, hi: 43, color: '#E8590C' },
  { key: '2mplus', label: '2+ months', severity: 'Critical', lo: 44, hi: 1e9, color: '#D13C2C' },
];
const DEPLOY_FYS = FYS;   // every financial year the demo covers, newest first
/**
 * empStatus follows the app's Employee Status filter: Active is today's staff, Inactive is people who have left
 * (counted up to their last day), All is both.
 */
function deployCost(idx, people, fy, empStatus) {
  const months = [];
  for (let m = fy.start; m <= fy.end; m = addDays(endOfMonth(m), 1)) months.push({ key: m.slice(0, 7), label: MON[+m.slice(5, 7) - 1], start: m, end: endOfMonth(m), cost: 0, headcount: 0 });
  const from = maxS(fy.start, idx.data.dataStart);   // demo records start on the data start date
  const to = lastWorkday(idx, minS(fy.end, AS_OF));
  const rows = [];
  if (!to || from > to) return { rows, months, workingDays: 0, from, to };
  const [i0, i1] = dayRange(idx, from, to);
  for (const e of people) {
    const row = idx.dailyPct.get(e.id);
    const daily = (e.hourlyCost || 0) * HOURS_PER_DAY;
    const perMonth = new Map();
    if ((empStatus === 'active' && e.left) || (empStatus === 'inactive' && !e.left)) continue;
    if (e.category !== 'delivery' && e.category !== 'supervisory') continue;   // interns, Support and FLIP are out
    const k0 = Math.max(i0, lowerBound(idx.workdays, e.joined));   // nothing counts before someone joins or after they leave
    const k1 = e.left ? Math.min(i1, lowerBound(idx.workdays, addDays(e.left, 1))) : i1;
    if (k0 >= k1) continue;
    // App bench_service: any booking makes a day deployed, whatever its %; overlapping bookings each count.
    const w0 = idx.workdays[k0], w1 = idx.workdays[k1 - 1];
    const allocs = idx.allocsBy.get(e.id) || [];
    const undeployed = (a0, b0) => {
      const s0 = maxS(a0, w0), e0 = minS(b0, w1);
      if (s0 > e0) return 0;
      let used = 0; for (const a of allocs) { const x = maxS(a.start, s0), y = minS(a.end, e0); if (x <= y) used += workdayCount(idx, x, y); }
      return Math.max(0, workdayCount(idx, s0, e0) - used);
    };
    const days = undeployed(w0, w1);
    if (!days) continue;
    for (const m of months) { const d = undeployed(m.start, m.end); if (d) { perMonth.set(m.key, d); m.cost += d * daily; m.headcount += 1; } }
    rows.push({ id: e.id, employee: e, team: idx.teamName.get(e.teamId), days, pct: (days / (k1 - k0)) * 100, cost: days * daily,
      bucket: DEPLOY_BUCKETS.find((b) => days >= b.lo && days <= b.hi).key, perMonth, noCost: e.hourlyCost == null });
  }
  return { rows, months, workingDays: i1 - i0, from, to };
}

/* ----- Intern Investment: stipend cost while an intern, within the selected FY (app intern_investment_service) ----- */
const INTERN_STATUS = {
  active: { label: 'Active', color: '#9C4BE6', cls: 'b-purple' },
  converted: { label: 'Converted', color: '#0D9458', cls: 'b-healthy', icon: 'check' },
  exited: { label: 'Exited', color: '#C3C6D9', cls: 'b-neutral' },
};
const INTERN_FYS = FYS;
/** Working days between two dates, counted directly (the allocation index starts at the data start). */
function workdaysBetween(from, to) {
  let n = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) if (!isWeekend(d)) n++;
  return n;
}
/**
 * empStatus follows the app's Employee Status filter: 'active' is today's roster (current interns and
 * interns since converted to full-time), 'inactive' is those who left, 'all' is both.
 */
function internInvestment(idx, f, fy, empStatus) {
  const q = f.query.trim().toLowerCase();
  const to = minS(fy.end, AS_OF);
  const months = [];
  for (let m = fy.start; m <= fy.end; m = addDays(endOfMonth(m), 1)) months.push({ key: m.slice(0, 7), label: MON[+m.slice(5, 7) - 1], start: m, end: endOfMonth(m), investment: 0, active: 0 });
  const rows = [];
  for (const it of idx.data.interns) {
    const isActive = it.status !== 'exited';
    if (empStatus === 'active' && !isActive) continue;
    if (empStatus === 'inactive' && isActive) continue;
    if (f.teamId !== ALL && it.teamId !== f.teamId) continue;
    if (f.skill !== ALL && it.skill !== f.skill) continue;
    if (q && !it.name.toLowerCase().includes(q) && !it.skill.toLowerCase().includes(q)) continue;
    // Converted on day X means an intern until the day before; an exit date is the last day.
    const last = it.end ? (it.status === 'converted' ? addDays(it.end, -1) : it.end) : to;
    const start = maxS(fy.start, it.joined);
    const end = minS(last, to);
    if (start > end) continue;
    const days = workdaysBetween(start, end);
    const daily = it.stipend * HOURS_PER_DAY;
    for (const m of months) {
      const s0 = maxS(start, m.start), e0 = minS(end, m.end);
      if (s0 <= e0) { const d = workdaysBetween(s0, e0); if (d) { m.investment += d * daily; m.active += 1; } }
    }
    rows.push({ id: it.id, intern: it, team: idx.teamName.get(it.teamId), activeDays: days, allocDays: Math.round((days * it.bookedPct) / 100),
      utilization: it.bookedPct, cost: days * daily, tenureDays: diffDays(it.joined, end) });
  }
  const bySkill = [...new Set(rows.map((r) => r.intern.skill))].map((s) => {
    const m = rows.filter((r) => r.intern.skill === s);
    return { skill: s, count: m.length, investment: m.reduce((t, r) => t + r.cost, 0) };
  }).sort((a, b) => b.investment - a.investment);
  return { rows, months, bySkill, from: fy.start, to: fy.end };
}

/* ----- MBR: one month's split of each person's allocation by business unit (app MBR report) ----- */
const MBR_STATUS = {
  billable: { label: 'Billable', color: '#0D9458', cls: 'b-healthy', icon: 'check' },
  partially_billable: { label: 'Partially Billable', color: '#C47E00', cls: 'b-under', icon: 'dash' },
  not_billable: { label: 'Not Billable', color: '#D13C2C', cls: 'b-over', icon: 'x' },
};
function mbrMonth(idx, monthKey, people, f) {
  const start = monthKey + '-01';
  const end = endOfMonth(start);   // the app reports the full month, including days still to come
  const days = workdayCount(idx, start, end);
  people = people.filter((e) => !e.left && e.joined <= end);   // the app's grid covers active employees
  const bus = idx.data.businessUnits;
  const rows = people.map((e) => {
    const bu = Object.fromEntries(bus.map((b) => [b.id, 0]));
    let internal = 0, booked = 0;
    // Each person's own window: from joining (or the 1st) to the month end; % = hours / their capacity in that window.
    const w0 = maxS(start, e.joined), w1 = end;
    const wdays = workdayCount(idx, w0, w1);
    for (const a of idx.allocsBy.get(e.id) || []) {
      const n = workdayCount(idx, maxS(a.start, w0), minS(a.end, w1));
      if (!n || !wdays) continue;
      booked++;
      const share = (a.percent * n) / wdays;
      const p = idx.projectById.get(a.projectId);
      if (p.bu) bu[p.bu] += share; else internal += share;
    }
    const billable = bus.reduce((s, b) => s + bu[b.id], 0);
    const total = billable + internal;
    const rb = billable;   // billable status uses the unrounded client share
    // Actuals: hours logged on timesheets that are due so far, and whether every due working day has an entry.
    const from = maxS(start, e.joined), to = minS(minS(end, idx.lastDue), e.left || '9999-12-31');
    let due = 0; for (let d = from; d <= to; d = addDays(d, 1)) if (!isWeekend(d) && !HOLIDAYS.includes(d)) due++;   // holidays need no entry
    const filedDays = new Set(); let hours = 0;
    for (const x of idx.entriesBy.get(e.id) || []) if (x.date >= from && x.date <= to) { filedDays.add(x.date); if (x.kind !== 'leave') hours += x.hours; }
    return { id: e.id, name: e.name, category: e.category, initials: e.initials, code: e.code, type: e.type, team: idx.teamName.get(e.teamId), bu, internal, billable, total,
      ready: Math.max(0, 100 - total), status: rb >= 100 ? 'billable' : rb > 0 ? 'partially_billable' : 'not_billable',
      actualHours: hours, filed: booked > 0 && filedDays.size >= due, capHours: wdays * HOURS_PER_DAY };   // fully filed needs a booking and no gaps
  });
  // Interns on the books during the month appear as Intern; their time is internal training work.
  const q = f.query.trim().toLowerCase();
  for (const it of idx.data.interns) {
    const last = it.end ? (it.status === 'converted' ? addDays(it.end, -1) : it.end) : '9999-12-31';
    if (it.status !== 'active' || it.joined > end || last < start) continue;   // current interns only; converted ones are in the employee rows
    if ((f.teamId !== ALL && it.teamId !== f.teamId) || (f.skill !== ALL && it.skill !== f.skill) || f.projectId !== ALL) continue;
    if (q && !it.name.toLowerCase().includes(q)) continue;
    rows.push({ id: it.id, name: it.name, category: 'intern', initials: it.initials, code: it.code, type: 'Intern', team: idx.teamName.get(it.teamId),
      bu: Object.fromEntries(bus.map((b) => [b.id, 0])), internal: it.bookedPct, billable: 0, total: it.bookedPct, ready: 100 - it.bookedPct, status: 'not_billable', actualHours: 0, filed: false, capHours: days * HOURS_PER_DAY });
  }

/* ----- Salary Bands: averages per role x experience band; small bands are hidden (app salary_band_service) ----- */
const EXP_BANDS = [['lt_1', '<1 yr', 0, 1, '#C9A2F2'], ['1_3', '1–3 yrs', 1, 3, '#AE77EC'], ['3_5', '3–5 yrs', 3, 5, '#9050DF'], ['5_8', '5–8 yrs', 5, 8, '#7030C2'], ['8_plus', '8+ yrs', 8, 99, '#4F1A8F']];
const ROLE_FAMILY = { de: 'Data Engineer', bi: 'BI & Analytics', app: 'Software Engineer', ai: 'ML Engineer', qa: 'QA Engineer', cloud: 'Cloud & DevOps' };
const MIN_BAND = 3;   // app MIN_COSTED_FOR_FIGURES: bands with fewer costed people show no averages
const SALARY_DEFAULTS = { share: 40, hours: 152, fx: 90 };   // app SalaryBand.DEFAULT_*
const bandOf = (y) => EXP_BANDS.find((b) => y >= b[2] && y < b[3]);
/** Role as the app derives it: the role on today's active booking with the most hours (ties: latest start); else Unallocated. */
function roleToday(idx, e, proj) {
  const a = (idx.allocsBy.get(e.id) || []).filter((x) => x.start <= AS_OF && x.end >= AS_OF && (proj === ALL || x.projectId === proj))
    .sort((x, y) => y.percent - x.percent || y.start.localeCompare(x.start))[0];
  return a ? bookingRole(e) : 'Unallocated';
}
/** The role a demo booking carries: broad, without seniority, like the app's allocation roles. */
function bookingRole(e) {
  if (e.teamId === 'app') return /mobile/i.test(e.role) ? 'Mobile Developer' : /backend|java|\.net/i.test(e.role) ? 'Backend Developer' : /manager/i.test(e.role) ? 'Engineering Manager' : 'Frontend Developer';
  return { de: 'Data Engineer', bi: 'BI Developer', ai: 'ML Engineer', qa: 'QA Engineer', cloud: 'Cloud Engineer' }[e.teamId];
}
const r2 = (n) => Math.round(n * 100) / 100;
function salaryBands(idx, people, a, proj = ALL) {
  const share = a.share / 100;
  const groups = new Map();
  for (const e of people.filter((x) => !x.left && x.category !== 'support')) {   // app population: active, not interns or Support
    const role = roleToday(idx, e, proj);
    const band = bandOf(e.expYears);
    const k = role.toLowerCase().replace(/\s+/g, ' ') + '|' + band[0];   // grouped case- and space-insensitively
    const g = groups.get(k) || { id: k, role, bandKey: band[0], bandLabel: band[1], order: EXP_BANDS.indexOf(band), people: [] };
    g.people.push(e); groups.set(k, g);
  }
  return [...groups.values()].map((g) => {
    const costed = g.people.filter((e) => e.hourlyCost > 0);
    const cost = costed.length ? r2(costed.reduce((s, e) => s + e.hourlyCost, 0) / costed.length) : null;
    const bill = cost != null ? r2(cost / share) : null;
    const monthly = cost != null ? Math.round(cost * a.hours * a.fx) : null;
    return { ...g, headcount: g.people.length, costed: costed.length, hidden: costed.length < MIN_BAND, cost, bill, margin: bill != null ? r2(bill - cost) : null, monthly, annual: monthly != null ? monthly * 12 : null,
      missingCost: g.people.length - costed.length, missingPrior: g.people.filter((e) => e.missingPriorExp).length };
  }).sort((x, y) => x.role.localeCompare(y.role) || x.order - y.order);
}

const REALIZATION = {

  partial: { label: 'Partially collected', color: '#C47E00', cls: 'b-under', icon: 'dash' },
  pending: { label: 'Pending', color: '#C3C6D9', cls: 'b-neutral', icon: 'clock' },
  overdue: { label: 'Overdue', color: '#D13C2C', cls: 'b-over', icon: 'alert' },
};
const INVOICE_STATUS = { not_invoiced: 'Not invoiced', draft: 'Draft', sent: 'Sent', partial: 'Partially paid', paid: 'Paid', overdue: 'Overdue' };   // app ITEM_INVOICE_STATUS order
const REALIZATION_ORDER = ['overdue', 'pending', 'partial', 'complete'];
function invoiceRows(idx, f, period, fy) {
  const q = f.query.trim().toLowerCase();
  const inFy = (m) => m >= fy.start.slice(0, 7) && m <= fy.end.slice(0, 7);
  return idx.data.invoices.filter((inv) => (period === 'fy' ? inFy(inv.month) : inv.month === period) && (f.projectId === ALL || inv.projectId === f.projectId)).map((inv) => {
    const p = idx.projectById.get(inv.projectId);
    // App: projected is the invoiced amount (the booked-hours estimate until invoiced); Paid counts as fully collected.
    const projected = inv.status === 'not_invoiced' ? inv.projected : inv.invoiced;
    const realised = inv.status === 'paid' ? Math.max(inv.paid, inv.invoiced) : inv.paid;
    const late = inv.due && inv.due < AS_OF;
    const status = realised >= projected ? 'complete' : late ? 'overdue' : realised > 0 ? 'partial' : 'pending';   // app order
    return { id: inv.id, inv, project: p, month: inv.month, projected, realised, pending: Math.max(0, projected - realised), status,
      daysOverdue: status === 'overdue' ? diffDays(inv.due, AS_OF) : 0 };
  }).filter((r) => !q || r.project.name.toLowerCase().includes(q) || r.project.client.toLowerCase().includes(q) || (r.project.sow || '').toLowerCase().includes(q));
}

const TONE = { good: { color: '#0D9458', label: 'Good' }, watch: { color: '#C47E00', label: 'Watch' }, concern: { color: '#E8590C', label: 'Concern' }, bad: { color: '#D13C2C', label: 'Act now' } };

/** The small "i" on a KPI card. Opens on hover, focus or click; Esc closes it. */
function KpiInfo({ title, info, align }) {
  const [open, setOpen] = useState(false);
  return (
    <span className="kinfo" onMouseEnter={() => setOpen(true)} onMouseLeave={() => setOpen(false)}>
      <button type="button" className="kinfo-btn" aria-label={'About ' + title} aria-expanded={open}
        onClick={() => setOpen((o) => !o)} onFocus={() => setOpen(true)} onBlur={() => setOpen(false)} onKeyDown={(e) => e.key === 'Escape' && setOpen(false)}>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.5" /><path d="M8 7.2v3.8M8 5h.01" strokeLinecap="round" /></svg>
      </button>
      {open && (
        <span className={'kinfo-pop ' + align} role="tooltip">
          <span className="kt">{title}</span>
          <span className="kp">{info.summary}</span>
          <span className="kh">How it's calculated</span>
          <span className="kp">{info.how}</span>
          <span className="kh">Who's included</span>
          <span className="kp">{info.who}</span>
          {info.note && <><span className="kh">Worth knowing</span><span className="kp kw">{info.note}</span></>}
        </span>
      )}
    </span>
  );
}

function Kpis({ items, scope }) {
  const infos = KPI_INFO[scope] || {};
  return (
    <div className={'kpis' + (items.length === 3 ? ' n3' : items.length > 4 ? ' many' : '')}>
      {items.map((k, i) => (
        <div className="kpi" key={k.label}>
          <div style={{ minWidth: 0 }}>
            <div className="lbl">{k.label}{infos[k.label] && <KpiInfo title={k.label} info={infos[k.label]} align={i >= 2 ? 'right' : 'left'} />}</div>
            <div className="val num" style={k.tone ? { color: toneColor(k.tone) } : undefined} title={k.tone ? TONE[k.tone].label : undefined}>{k.value}{k.unit && <small>{k.unit}</small>}</div>
            <div className="sub">{k.sub}</div>
          </div>
          {k.spark && <Spark {...k.spark} />}
        </div>
      ))}
    </div>
  );
}

/** The app's KPI sub-line: a small triangle and coloured text. tone: bad (red), good (green), neutral (ink). */
function Trend({ dir = 'down', tone = 'bad', title, children }) {
  return <span className={'trend ' + tone} title={title}><span className="tri" aria-hidden="true">{dir === 'up' ? '▲' : '▼'}</span>{children}</span>;
}

function Delta({ now, prev, unit = ' pts' }) {
  if (now == null || prev == null) return <span className="dim">No prior period in the data</span>;
  const d = Math.round(now - prev);
  if (d === 0) return <span className="dim">Same as prior period</span>;
  return <><Trend dir={d > 0 ? 'up' : 'down'} tone="neutral"><b className="num">{Math.abs(d)}{unit}</b></Trend><span className="dim">vs prior period</span></>;
}

/** Sortable, paginated table with CSV export and optional expandable rows. Columns: {key,label,align,render,value,csv,sortable}. */
function DataTable({ columns, rows, initialSort, onRowClick, highlight, empty, csvName, pageSize = 12, expand, group }) {
  const [sort, setSort] = useState(initialSort || { key: columns[0].key, dir: 'asc' });
  const [shown, setShown] = useState(pageSize);
  const [open, setOpen] = useState(() => new Set());
  useEffect(() => setShown(pageSize), [rows, pageSize]);
  const col = columns.find((c) => c.key === sort.key);
  const sorted = useMemo(() => {
    if (!col) return rows;
    const v = col.value || ((r) => r[col.key]);
    return [...rows].sort((a, b) => { const x = v(a), y = v(b); const c = x == null ? 1 : y == null ? -1 : x < y ? -1 : x > y ? 1 : 0; return sort.dir === 'asc' ? c : -c; });
  }, [rows, sort, col]);
  const exportCsv = () => {
    const cell = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const lines = [columns.map((c) => cell(c.label)).join(',')].concat(sorted.map((r) => columns.map((c) => cell(c.csv ? c.csv(r) : (c.value ? c.value(r) : r[c.key]))).join(',')));
    const url = URL.createObjectURL(new Blob(['﻿# Demo data, synthetic\n' + lines.join('\n')], { type: 'text/csv' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `${csvName}-demo.csv` });
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  // Group By: each row goes under one or more headings; catch-all headings sort last.
  const items = (() => {
    if (!group) return sorted.map((r) => ({ r, key: r.id }));
    const m = new Map();
    for (const r of sorted) for (const g of [].concat(group(r))) (m.get(g) || m.set(g, []).get(g)).push(r);
    const last = (g) => (/^(Unallocated|Nobody)/.test(g) ? 1 : 0);
    return [...m.keys()].sort((a, b) => last(a) - last(b) || a.localeCompare(b))
      .flatMap((g) => [{ head: g, n: m.get(g).length, key: 'h:' + g }, ...m.get(g).map((r) => ({ r, key: g + ':' + r.id }))]);
  })();
  const total = items.filter((it) => !it.head).length;
  const visible = []; { let n = 0; for (const it of items) { if (n >= shown) break; if (!it.head) n++; visible.push(it); } }
  const toggle = (id) => setOpen((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  if (!rows.length) return <div className="state"><h3>{empty || 'Nothing to show'}</h3><p>Widen the date range or clear a filter to see records.</p></div>;
  const span = columns.length + (expand ? 1 : 0);
  return (
    <>
      <div className="tbl-wrap">
        <table>
          <thead><tr>{expand && <th style={{ width: 28 }} aria-label="Expand" />}{columns.map((c) => (
            <th key={c.key} className={c.align === 'right' ? 'r' : ''} aria-sort={sort.key === c.key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}>
              {c.sortable === false ? c.label : <button type="button" onClick={() => setSort({ key: c.key, dir: sort.key === c.key && sort.dir === 'desc' ? 'asc' : 'desc' })}>{c.label}<Icon name="sort" size={11} style={{ opacity: sort.key === c.key ? 1 : 0.35 }} /></button>}
            </th>))}</tr></thead>
          <tbody>{visible.map(({ r, head, n, key }) => {
            if (head) return <tr key={key} className="grp"><td colSpan={span}>{head}<span className="sub2" style={{ marginLeft: 8 }}>{n}</span></td></tr>;
            const isOpen = expand && open.has(r.id);
            const click = expand ? () => toggle(r.id) : onRowClick ? () => onRowClick(r) : undefined;
            return (
              <React.Fragment key={key}>
                <tr className={(click ? 'click ' : '') + (highlight === r.id ? 'hl' : '')} onClick={click} aria-expanded={expand ? !!isOpen : undefined}>
                  {expand && <td><span className={'chev' + (isOpen ? ' open' : '')}><Icon name="chev" size={12} /></span></td>}
                  {columns.map((c) => <td key={c.key} className={c.align === 'right' ? 'r num' : ''}>{c.render ? c.render(r) : r[c.key]}</td>)}
                </tr>
                {isOpen && <tr className="detail"><td colSpan={span}>{expand(r)}</td></tr>}
              </React.Fragment>
            );
          })}</tbody>
        </table>
      </div>
      <div className="tbl-foot">
        <span>Showing {Math.min(shown, total)} of {total}{group ? ' rows' : ''}{expand ? '. Click a row for details.' : ''}</span>
        <span style={{ display: 'flex', gap: 6 }}>
          {shown < total && <button className="btn sm" type="button" onClick={() => setShown(shown + pageSize * 2)}>Show more</button>}
          <button className="btn sm" type="button" onClick={exportCsv}><Icon name="download" size={12} />Download CSV</button>
        </span>
      </div>
    </>
  );
}

function Attention({ groups }) {
  const total = groups.reduce((s, g) => s + g.items.length, 0);
  if (!total) return <div className="state" style={{ padding: '24px 8px' }}><Icon name="check" size={20} style={{ color: 'var(--green)' }} /><h3>Nothing needs attention</h3><p>No exceptions for these filters.</p></div>;
  return groups.filter((g) => g.items.length).map((g) => (
    <div key={g.title}>
      <div className="att-group"><span>{g.title}</span><span className="num">{g.items.length}</span></div>
      <ul className="att">{g.items.slice(0, g.limit || 4).map((it) => (
        <li key={it.key}>{React.createElement(it.onClick ? 'button' : 'div', it.onClick ? { type: 'button', 'aria-pressed': !!it.active, onClick: it.onClick } : { className: 'static' },
          <span style={{ color: it.color, paddingTop: 2 }}><Icon name={it.icon} size={16} /></span>,
          <span><div className="who">{it.who}</div><div className="why">{it.why}</div></span>,
          <span className="fig num">{it.fig}</span>)}</li>))}
        {g.items.length > (g.limit || 4) && <li><div className="more">and {g.items.length - (g.limit || 4)} more</div></li>}
      </ul>
    </div>
  ));
}

  const byTeam = idx.data.teams.map((t) => {
    const m = ready.filter((r) => r.employee.teamId === t.id);
    return { teamId: t.id, team: t.name, free: m.filter((r) => r.currentPct === 0).length, partial: m.filter((r) => r.currentPct > 0).length, total: m.length };
  }).filter((r) => r.total);
  // How long each person has been at or below the threshold: an ordered scale, so one hue light to dark.
  const AGE = [
    { key: 'a', label: 'Under 2 weeks', test: (d) => d < 14, color: '#C9A2F2' },
    { key: 'b', label: '2 to 4 weeks', test: (d) => d >= 14 && d <= 30, color: '#A86BEA' },
    { key: 'c', label: '1 to 3 months', test: (d) => d > 30 && d <= 90, color: '#8A36D8' },
    { key: 'd', label: 'More than 3 months', test: (d) => d > 90, color: '#5B1E9E' },
  ];
  const ageOf = (r) => AGE.find((a) => a.test(r.onBenchDays)).key;
  const rows = ready.filter((r) => (!teamDrill || r.employee.teamId === teamDrill) && (!focus || r.id === focus) && (!ageDrill || ageOf(r) === ageDrill));

  return (
    <>
      <Kpis scope="bench" items={[
        { label: 'Ready to deploy', value: ready.length, unit: `of ${people.length}`, sub: <span className="dim">At or below {threshold}% booked on {fmtDate(at)}</span>, spark: { data: trend, k: 'ready', color: '#3D4466' } },
        { label: 'Fully unbooked', value: free.length, sub: <span className="dim">0% booked, can start {fmtDate(idx.workdays[idx.dayIndex.get(at) + 1])}</span> },
        { label: 'Rolling off in 6 weeks', value: rolls.length, sub: <span className="dim">Bookings end and leave them at {threshold}% or below by {fmtDate(addDays(AS_OF, 42))}</span> },
      ]} />

      <div className="row main">
        <Panel title="Ready-to-deploy pool over time" note={`People booked at or below ${threshold}% on average each week.`}
          tools={<Seg small label="Threshold" options={[[25, '≤ 25%'], [50, '≤ 50%'], [75, '≤ 75%']]} value={threshold} onChange={setThreshold} />}>
          <div className="chart"><ResponsiveContainer>
            <AreaChart data={trend} margin={{ top: 10, right: 24, bottom: 0, left: -20 }}>
              {hGrid}
              <XAxis dataKey="label" {...axis} minTickGap={18} />
              <YAxis {...axis} allowDecimals={false} />
              <Tooltip cursor={{ stroke: '#C3C6D9' }} content={<Tip title={(p) => `Week of ${fmtDate(p.key, true)}`} rows={(p) => [['Ready to deploy', p.ready, '#9C4BE6'], ['Team utilization', fmtPct(p.allocated)]]} />} />
              <Area dataKey="ready" type="stepAfter" stroke="#9C4BE6" strokeWidth={2} fill="#9C4BE6" fillOpacity={0.14} activeDot={{ r: 4.5, stroke: '#fff', strokeWidth: 2 }} isAnimationActive={false} />
            </AreaChart>
          </ResponsiveContainer></div>
        </Panel>
        <Panel title="Needs attention">
          <Attention groups={[
            { title: 'Longest without a booking', items: [...ready].sort((a, b) => b.onBenchDays - a.onBenchDays).slice(0, 3).map((r) => ({ key: r.id, who: r.employee.name, why: `${r.employee.role}, ${r.matches.length ? `${r.matches.length} matching open position${r.matches.length > 1 ? 's' : ''}` : 'no matching open position'}`, fig: r.since ? `${r.onBenchDays} d` : `${r.onBenchDays}+ d`, icon: 'user', color: 'var(--amber)', active: focus === r.id, onClick: () => setFocus(focus === r.id ? null : r.id) })) },
            { title: 'Rolling off soon', items: rolls.map((r) => ({ key: r.employee.id + r.project.id, who: r.employee.name, why: `${r.project.name} ends ${fmtDate(r.endsOn)}, ${r.remaining}% booked after`, fig: fmtDate(r.endsOn), icon: 'calendar', color: 'var(--ink-2)' })) },
          ]} />
        </Panel>
      </div>

      <Panel title={`Ready to deploy on ${fmtDate(at, true)}, threshold ${threshold}%`} note="Delivery and Supervisory staff booked at or below the threshold on the range's last working day. Available from is the day after their current bookings end. Click a row for bookings and matching positions."
        tools={<>{ageDrill && <Chip onClear={() => setAgeDrill(null)}>Available {AGE.find((a) => a.key === ageDrill).label.toLowerCase()}</Chip>}{teamDrill && <Chip onClear={() => setTeamDrill(null)}>{idx.teamName.get(teamDrill)}</Chip>}{focus && <Chip onClear={() => setFocus(null)}>{idx.employeeById.get(focus).name}</Chip>}</>}>
        <DataTable csvName="ready-to-deploy" rows={rows} group={peopleGroup(groupBy)} initialSort={{ key: 'currentPct', dir: 'asc' }} empty="No one ready to deploy in this selection"
          expand={(r) => (
            <div className="slots">
              {r.current.map((c) => <div className="slot" key={c.project.id}><span className="n num">{c.percent}%</span><span>{c.project.name}</span><span className="sub2">until {fmtDate(c.end, true)}</span></div>)}
              {!r.current.length && <div className="sub2">Nothing booked.</div>}
              <div className="sub2" style={{ marginTop: 4 }}>{r.matches.length ? <>Matches open positions: {r.matches.map((p) => <span key={p.id} className="code" style={{ marginRight: 8 }}>{p.code} {p.role}</span>)}</> : 'No open position needs this person\'s main skills at their level.'}</div>
            </div>)}
          columns={[
            { key: 'name', label: 'Employee', value: (r) => r.employee.name, render: (r) => <Person e={r.employee} sub={r.employee.role} /> },
            { key: 'team', label: 'Team' },
